<!--
SQL Supabase (opcional) — ejecutar en el SQL Editor si querés la galería en la nube.
Si no lo configurás, todo funciona igual con almacenamiento local.

-- BUCKET TIENDAS
INSERT INTO storage.buckets (id, name, public, file_size_limit, allowed_mime_types)
VALUES ('tiendas','tiendas', true, 5242880, ARRAY['image/jpeg','image/jpg'])
ON CONFLICT (id) DO NOTHING;

DROP POLICY IF EXISTS "tiendas_public_read"   ON storage.objects;
DROP POLICY IF EXISTS "tiendas_public_insert" ON storage.objects;
DROP POLICY IF EXISTS "tiendas_public_delete" ON storage.objects;
CREATE POLICY "tiendas_public_read"   ON storage.objects FOR SELECT USING (bucket_id='tiendas');
CREATE POLICY "tiendas_public_insert" ON storage.objects FOR INSERT WITH CHECK (bucket_id='tiendas');
CREATE POLICY "tiendas_public_delete" ON storage.objects FOR DELETE USING (bucket_id='tiendas');

CREATE TABLE IF NOT EXISTS tiendas_guardadas (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  nombre TEXT NOT NULL, tema TEXT,
  imagen_url TEXT NOT NULL, imagen_path TEXT NOT NULL,
  fecha TIMESTAMPTZ DEFAULT NOW());
CREATE INDEX IF NOT EXISTS idx_tiendas_fecha ON tiendas_guardadas (fecha DESC);
ALTER TABLE tiendas_guardadas ENABLE ROW LEVEL SECURITY;
CREATE POLICY "public_tiendas" ON tiendas_guardadas FOR ALL USING (true) WITH CHECK (true);
-->
<style>
:root{
  --rojo:#c0392b;--rojo-claro:#e74c3c;--verde:#2e9e3f;--verde-hover:#267f34;
  --dorado:#d4af37;--dorado-claro:#f1c40f;
  --sombra:rgba(0,0,0,.12);--sombra-fuerte:rgba(0,0,0,.22);
  --fondo:#eef5fb;--texto:#1f2937;--texto-suave:#5b6472;
  --tarjeta-bg:#ffffff;--borde:#e5eaf0;--input-bg:#fff;--input-border:#cbd5e1;--modal-bg:#fff;
  --acento-suave:#fdf6e3;
}
[data-theme="dark"]{
  --fondo:#0f1729;--texto:#e8eef5;--texto-suave:#a3aec2;
  --tarjeta-bg:#1a2438;--borde:#2c3a54;--sombra:rgba(0,0,0,.35);--sombra-fuerte:rgba(0,0,0,.6);
  --rojo:#ef5350;--rojo-claro:#ff6b6b;--verde:#3dbb54;--verde-hover:#34a047;
  --dorado:#e6c154;--input-bg:#0f1729;--input-border:#334155;--modal-bg:#0f1729;
  --acento-suave:#1f2c44;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:100%}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:var(--fondo);color:var(--texto);line-height:1.6;padding:22px 20px 30px;min-height:100vh;transition:background-color .3s,color .3s;overflow-x:hidden}
body.modal-abierto{overflow:hidden}
.oculto{display:none!important}

/* ===== BOTONES GENERALES ===== */
.btn-icono{width:46px;height:46px;border-radius:50%;border:2px solid var(--dorado);background:var(--tarjeta-bg);color:var(--texto);font-size:1.25rem;cursor:pointer;box-shadow:0 4px 14px var(--sombra-fuerte);display:flex;align-items:center;justify-content:center}
.btn-ver-listas{background:linear-gradient(135deg,var(--verde),var(--verde-hover));color:#fff;border:none;padding:12px 24px;font-size:.95rem;border-radius:30px;cursor:pointer;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;gap:8px;box-shadow:0 6px 16px rgba(46,158,63,.35)}

/* ===== SECCIÓN TIENDA ===== */
.tienda-box{position:relative;background:linear-gradient(160deg,var(--tarjeta-bg) 0%,var(--acento-suave) 100%);border:2px solid var(--dorado);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;box-shadow:0 10px 28px var(--sombra);min-width:0;margin:0 auto 24px;max-width:1200px}
.tienda-titulo{color:var(--rojo);text-align:center;font-size:clamp(.9rem,1.4vw,1.1rem);font-weight:800;letter-spacing:.5px;margin-bottom:8px;text-transform:uppercase}
.tienda-temas{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:10px;padding:4px;width:100%;background:var(--fondo);border-radius:12px;border:1px solid var(--borde)}
.tema-btn{border:2px solid var(--borde);background:var(--tarjeta-bg);color:var(--texto);padding:6px 12px;border-radius:16px;cursor:pointer;font-size:.78rem;font-weight:700;transition:all .15s;white-space:nowrap}
.tema-btn:hover{border-color:var(--dorado)}
.tema-btn.activo{background:linear-gradient(135deg,var(--rojo),var(--rojo-claro));color:#fff;border-color:var(--rojo);box-shadow:0 3px 10px rgba(192,57,43,.4)}
.tienda-captura{width:100%;display:flex;justify-content:center;align-items:flex-start;padding:6px 0;overflow:hidden;position:relative}
.tienda-escenario{position:relative;width:96%;max-width:100%;aspect-ratio:1 / 1;background:#fdf6e3;overflow:hidden;display:block;border-radius:8px;box-shadow:0 6px 18px var(--sombra-fuerte);touch-action:none;transform-origin:0 0;will-change:transform;transition:transform 0.08s ease-out;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@media(min-width:600px){.tienda-escenario{width:94%;aspect-ratio:1 / 1}}
@media(min-width:1024px){.tienda-escenario{width:90%;max-width:1000px;aspect-ratio:1 / 1}}
.tienda-zoom-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#f1c40f;padding:3px 10px;border-radius:12px;font-size:.68rem;font-weight:800;letter-spacing:.4px;z-index:30;pointer-events:none;transition:opacity .3s;opacity:0;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.tienda-zoom-indicator.visible{opacity:1}
.tienda-pared{position:absolute;top:0;left:0;right:0;height:55%;background-color:#f5e6c8;background-image:repeating-linear-gradient(0deg,transparent 0,transparent 20px,rgba(139,111,71,.18) 20px,rgba(139,111,71,.18) 22px),repeating-linear-gradient(90deg,transparent 0,transparent 20px,rgba(139,111,71,.18) 20px,rgba(139,111,71,.18) 22px),radial-gradient(ellipse at center 30%, rgba(255,245,220,.55), transparent 70%),linear-gradient(180deg, rgba(180,140,90,.08) 0%, rgba(90,58,26,.22) 100%);border-bottom:3px solid #5a3a1a;box-shadow:inset 0 -6px 12px rgba(0,0,0,.3)}
.tienda-suelo{position:absolute;top:55%;left:0;right:0;bottom:0;background:radial-gradient(ellipse 100% 100% at 50% 0%, rgba(0,0,0,.32) 0%, transparent 45%),linear-gradient(180deg, #c99868 0%, #d4a574 50%, #b8935f 100%);overflow:hidden}
.tienda-suelo-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.tienda-suelo-svg .piso-long line{stroke:rgba(90,58,26,.42);stroke-width:.35;fill:none}
.tienda-suelo-svg .piso-trans line{stroke:rgba(90,58,26,.28);stroke-width:.28}
.tienda-alfombra{position:absolute;left:18%;right:18%;bottom:18%;height:16%;z-index:2;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4)) drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.tienda-alfombra svg{display:block;width:100%;height:100%}
.alfombra-cuerpo{fill:#c0392b;stroke:#8b1a0f;stroke-width:1.5}
.alfombra-borde-punteado{fill:none;stroke:#f1c40f;stroke-width:0.8;stroke-dasharray:1.5 1.5}
.alfombra-borde-exterior{fill:none;stroke:#d4af37;stroke-width:1.2}
.alfombra-rombo{fill:#f1c40f}
.tienda-copos{position:absolute;top:0;left:0;right:0;height:55%;pointer-events:none;z-index:1;background-image:radial-gradient(circle at 6% 30%, rgba(255,255,255,.7) 1px, transparent 2px),radial-gradient(circle at 15% 55%, rgba(255,255,255,.6) 1.5px, transparent 2.5px),radial-gradient(circle at 24% 25%, rgba(255,255,255,.75) 1px, transparent 2px),radial-gradient(circle at 78% 40%, rgba(255,255,255,.7) 1px, transparent 2px),radial-gradient(circle at 88% 60%, rgba(255,255,255,.6) 1.5px, transparent 2.5px),radial-gradient(circle at 95% 30%, rgba(255,255,255,.7) 1px, transparent 2px),radial-gradient(circle at 12% 8%, rgba(255,255,255,.55) 1.5px, transparent 2.5px),radial-gradient(circle at 84% 12%, rgba(255,255,255,.55) 1.5px, transparent 2.5px)}
.tienda-luces-techo{position:absolute;top:0;left:0;right:0;height:34%;pointer-events:none;z-index:3;overflow:visible}
.tienda-guirnalda{position:absolute;top:6%;left:0;right:0;height:8%;pointer-events:none;z-index:3;overflow:visible}
.tienda-guirnalda.dos{top:16%;height:7%;opacity:.92}
.tienda-ambiente{position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse 90% 45% at 50% 0%, rgba(255,210,120,.16) 0%, transparent 70%),radial-gradient(ellipse 60% 35% at 50% 100%, rgba(255,150,60,.1) 0%, transparent 70%)}
.tienda-rotulo{position:absolute;top:1.5%;left:50%;transform:translateX(-50%);width:88%;height:6.5%;min-height:22px;background:linear-gradient(180deg, #d4b58a 0%, #b8956a 35%, #8b6f47 70%, #5a3a1a 100%);border:2.5px solid #8b1a0f;border-radius:6px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #3a2410,0 8px 16px rgba(0,0,0,.42),inset 0 3px 0 rgba(255,255,255,.42),inset 0 -2px 4px rgba(0,0,0,.35),0 0 0 1.5px #f1c40f,0 0 24px rgba(241,196,15,.38);z-index:10;padding:0 22px;cursor:pointer;user-select:none;transition:transform .15s, box-shadow .15s}
.tienda-rotulo:hover{transform:translateX(-50%) translateY(-1px)}
.tienda-rotulo::before,.tienda-rotulo::after{content:'';position:absolute;width:8px;height:8px;background:linear-gradient(135deg, #f1c40f, #a07a00);border:1px solid #7a5f00;border-radius:1px;top:50%;transform:translateY(-50%);box-shadow:0 0 4px rgba(241,196,15,.7)}
.tienda-rotulo::before{left:4px}.tienda-rotulo::after{right:4px}
.tienda-rotulo-texto{color:#fdf6e3;font-family:Georgia,'Times New Roman',serif;font-weight:900;font-size:clamp(10px, 1.8vw, 14px);text-align:center;letter-spacing:1.5px;text-transform:uppercase;text-shadow:1px 1px 0 #3a2410,2px 2px 0 #3a2410,0 0 8px rgba(241,196,15,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1}
.tienda-rotulo-edit{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:clamp(7px,.9vw,9px);opacity:0;transition:opacity .15s;pointer-events:none}
.tienda-rotulo:hover .tienda-rotulo-edit{opacity:.95}
.tienda-ventana{position:absolute;left:32%;right:32%;top:10%;bottom:45%;padding:4px;background:linear-gradient(180deg,#8b6f47 0%,#6b4a1f 50%,#4a3018 100%);border:3px solid #3a2410;border-radius:4px;box-shadow:inset 0 0 10px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.15),0 3px 8px rgba(0,0,0,.35),0 0 0 1px rgba(241,196,15,.15);z-index:2;overflow:hidden}
.ventana-panel{position:relative;width:100%;height:100%;overflow:hidden;border:1px solid #3a2410;box-shadow:inset 0 0 6px rgba(0,0,0,.4), inset 2px 0 4px rgba(0,0,0,.2);background:#87CEEB}
.ventana-panel svg{width:100%;height:100%;display:block}
.ventana-cortina{position:absolute;top:4px;bottom:4px;width:14%;z-index:4;pointer-events:none}
.ventana-cortina-izq{left:4px;background:linear-gradient(90deg, rgba(192,57,43,.85) 0%, rgba(153,45,34,.6) 60%, rgba(192,57,43,.15) 100%);border-radius:0 6px 6px 0;border-right:1px solid rgba(90,21,16,.5);box-shadow:inset -4px 0 8px rgba(0,0,0,.35)}
.ventana-cortina-der{right:4px;background:linear-gradient(270deg, rgba(192,57,43,.85) 0%, rgba(153,45,34,.6) 60%, rgba(192,57,43,.15) 100%);border-radius:6px 0 0 6px;border-left:1px solid rgba(90,21,16,.5);box-shadow:inset 4px 0 8px rgba(0,0,0,.35)}
.ventana-cortina::after{content:'';position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(180deg, rgba(241,196,15,.75), rgba(212,175,55,.4));border-radius:2px;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.ventana-panel::after{content:'';position:absolute;bottom:0;left:0;right:0;height:22px;pointer-events:none;z-index:5;background:radial-gradient(circle at 6% 70%, #fff 0%, #fff 3px, transparent 4px),radial-gradient(circle at 16% 55%, #fff 0%, #fff 4px, transparent 5px),radial-gradient(circle at 26% 78%, #fff 0%, #fff 3px, transparent 4px),radial-gradient(circle at 36% 58%, #fff 0%, #fff 4px, transparent 5px),radial-gradient(circle at 46% 75%, #fff 0%, #fff 3px, transparent 4px),radial-gradient(circle at 56% 56%, #fff 0%, #fff 5px, transparent 6px),radial-gradient(circle at 66% 76%, #fff 0%, #fff 3px, transparent 4px),radial-gradient(circle at 76% 55%, #fff 0%, #fff 4px, transparent 5px),radial-gradient(circle at 86% 78%, #fff 0%, #fff 3px, transparent 4px),radial-gradient(circle at 94% 60%, #fff 0%, #fff 4px, transparent 5px),linear-gradient(to top, #fff 0%, #f5faff 60%, rgba(240,248,255,.4) 85%, transparent 100%);border-radius:45% 45% 0 0 / 100% 100% 0 0;filter:drop-shadow(0 -2px 3px rgba(255,255,255,.8)) drop-shadow(0 1px 2px rgba(120,150,180,.4))}
.estante-torre{position:absolute;top:10%;bottom:40%;width:28%;background-image:repeating-linear-gradient(90deg, transparent 0, transparent 7px, rgba(60,40,20,.15) 7px, rgba(60,40,20,.15) 8px),repeating-linear-gradient(0deg, transparent 0, transparent 18px, rgba(60,40,20,.08) 18px, rgba(60,40,20,.08) 19px),linear-gradient(180deg, #a0825a 0%, #8b6f47 45%, #7a5f3c 100%);border:2px solid #4a3218;border-radius:3px;padding:3px;display:grid;grid-template-rows:repeat(5, 1fr);gap:2px;box-shadow:5px 5px 0 #5a3a1a,10px 10px 0 #3a2410,0 14px 24px rgba(0,0,0,.42),inset 0 3px 0 rgba(255,255,255,.15),inset 0 -6px 12px rgba(0,0,0,.28),inset 3px 0 8px rgba(0,0,0,.18),inset -3px 0 8px rgba(0,0,0,.18);z-index:2}
.torre-izq{left:2%}.torre-der{right:2%}
.estante-fila{display:grid;grid-template-columns:repeat(3, 1fr);gap:1px;padding:2px;background:linear-gradient(180deg, #7a5a32 0%, #6b4a1f 100%);border-radius:2px;border-bottom:2px solid #3a2410;box-shadow:inset 0 3px 6px rgba(0,0,0,.4),inset 0 -1px 0 rgba(255,255,255,.08),0 1px 0 rgba(255,255,255,.05)}
.estante-fila:last-child{border-bottom:none;padding-bottom:2px}
.slot-zone{position:relative;background:linear-gradient(180deg, #f5e6c8 0%, #e8d5a8 100%);border-radius:1px;pointer-events:none;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.items-layer{position:absolute;inset:0;z-index:5;pointer-events:none}
.tienda-item{position:absolute;width:min(11%, 52px);aspect-ratio:1;transform-origin:center center;cursor:grab;pointer-events:auto;transition:transform .12s ease-out;will-change:transform, left, top;touch-action:none}
.tienda-item:active{cursor:grabbing}
.tienda-item.dragging{cursor:grabbing;transition:none;filter:drop-shadow(0 8px 16px rgba(0,0,0,.65)) drop-shadow(0 0 10px rgba(241,196,15,.75)) brightness(1.12)}
.tienda-item-content{width:100%;height:100%;pointer-events:none;display:flex;align-items:center;justify-content:center}
.tienda-item-content svg{width:100%;height:100%;display:block;filter:drop-shadow(2px 3px 2px rgba(0,0,0,.42)) drop-shadow(5px 11px 6px rgba(0,0,0,.28));pointer-events:none}
.tienda-item .rotulo{font-size:clamp(5px, 0.85vw, 9px);padding:1px 3px}
.tienda-item-precio{position:absolute;bottom:-12%;left:50%;transform:translateX(-50%);background:#e8d060;color:#222;font-size:clamp(5px, 0.7vw, 7px);font-weight:900;padding:0.5px 3px;border-radius:2px;border:1px solid #a07a00;white-space:nowrap;line-height:1;pointer-events:none;box-shadow:0 1px 2px rgba(0,0,0,.3);display:none}
.tienda-item.en-slot .tienda-item-precio{display:block;background:#2e9e3f;color:#fff;border-color:#1a5c2a}
.tienda-item.en-slot .tienda-item-precio::before{content:'✓ ';font-size:.9em}
.item-delete,.item-rotate{position:absolute;width:18px;height:18px;border-radius:50%;color:#fff;border:1.5px solid #fff;font-size:11px;font-weight:900;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0;line-height:1;box-shadow:0 2px 4px rgba(0,0,0,.4);pointer-events:auto;z-index:2}
.item-delete{top:-8px;right:-8px;background:#e74c3c}
.item-rotate{top:-8px;left:-8px;background:#3498db}
.tienda-item:hover .item-delete,.tienda-item.dragging .item-delete,.tienda-item:hover .item-rotate,.tienda-item.dragging .item-rotate{display:flex}
.item-delete:hover{background:#c0392b;transform:scale(1.15)}
.item-rotate:hover{background:#2980b9;transform:scale(1.15)}
.tienda-mostrador{position:absolute;right:2%;bottom:2%;width:52%;height:22%;z-index:3}
.mostrador-base{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg, transparent 0, transparent 12px, rgba(60,40,20,.18) 12px, rgba(60,40,20,.18) 13px),linear-gradient(180deg, #a0825a 0%, #8b6f47 40%, #6b4a1f 100%);border:2px solid #4a3218;border-radius:4px;box-shadow:0 5px 0 #3a2410, 0 12px 22px rgba(0,0,0,.5), inset 0 3px 0 rgba(255,255,255,.18), inset 0 -4px 10px rgba(0,0,0,.32)}
.mostrador-base::before{content:'';position:absolute;left:0;right:0;top:42%;height:2px;background:linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.15));box-shadow:0 -1px 0 rgba(255,255,255,.15), 0 2px 3px rgba(0,0,0,.4)}
.mostrador-slots{position:absolute;left:3%;top:6%;width:54%;height:38%;display:grid;grid-template-columns:repeat(2, 1fr);grid-template-rows:repeat(2, 1fr);gap:3px;z-index:2}
.mostrador-slots .slot-zone{background:linear-gradient(180deg, #f5e6c8 0%, #e8d5a8 100%);border-radius:2px;border:1px solid rgba(90,58,26,.4);box-shadow:inset 0 1px 3px rgba(0,0,0,.2)}
.tienda-caja{position:absolute;right:4%;top:2%;width:38%;height:64%;background:linear-gradient(180deg, #6b4a1f 0%, #3a2410 100%);border:2px solid #1a0d05;border-radius:4px 4px 2px 2px;box-shadow:0 3px 0 #1a0d05, 0 6px 12px rgba(0,0,0,.5), inset 0 3px 0 rgba(255,255,255,.15), inset 0 -3px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:3px;z-index:3}
.caja-pantalla{background:#050505;border:1.5px solid #222;border-radius:3px;padding:3px 5px;text-align:center;box-shadow:inset 0 0 8px rgba(100,255,100,.35);width:92%;max-width:94%;z-index:1}
.caja-label{font-size:clamp(5px, .9vw, 7px);color:#90ee90;font-weight:700;letter-spacing:1px;opacity:.9;line-height:1}
.caja-total{font-family:'Courier New',monospace;font-size:clamp(8px, 1.5vw, 13px);color:#fff;font-weight:900;text-shadow:0 0 8px rgba(180,255,180,0.8);letter-spacing:.3px;line-height:1.15;margin-top:1px;white-space:nowrap}
.mostrador-personajes-hint{position:absolute;left:6%;top:50%;width:44%;height:22%;border:1px dashed rgba(241,196,15,.35);border-radius:4px;pointer-events:none;z-index:1}
.mostrador-personajes-hint::after{content:'👤';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:9px;opacity:.35}
.btn-expand-store{position:absolute;top:14px;right:14px;z-index:20;width:34px;height:34px;border-radius:50%;border:2px solid var(--dorado);background:rgba(255,255,255,.92);color:#333;font-size:1.05rem;font-weight:900;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.btn-expand-store:hover{transform:scale(1.1);background:#fff;box-shadow:0 5px 14px rgba(0,0,0,.45), 0 0 12px rgba(241,196,15,.6)}

/* ===== CATÁLOGO ===== */
.tienda-catalogo{margin-top:10px;display:flex;flex-direction:column;gap:6px;width:100%}
.tienda-tabs{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.tab-categoria{border:2px solid var(--borde);background:var(--tarjeta-bg);color:var(--texto);padding:5px 10px;border-radius:18px;cursor:pointer;font-size:.76rem;font-weight:700;transition:all .15s;white-space:nowrap}
.tab-categoria:hover{border-color:var(--dorado)}
.tab-categoria.activo{background:linear-gradient(135deg,var(--verde),var(--verde-hover));color:#fff;border-color:var(--verde);box-shadow:0 3px 8px rgba(46,158,63,.35)}
.tienda-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px;max-height:150px;overflow-y:auto;padding:4px;background:var(--fondo);border-radius:8px;border:1px solid var(--borde)}
.item-catalogo{background:var(--tarjeta-bg);border:2px solid var(--borde);border-radius:8px;padding:4px 3px 3px 3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s, border-color .15s, box-shadow .15s;text-align:center;min-width:0}
.item-catalogo:hover{transform:translateY(-2px);border-color:var(--dorado);box-shadow:0 4px 10px var(--sombra)}
.item-catalogo svg{width:38px;height:38px;filter:drop-shadow(2px 2px 2px rgba(0,0,0,0.35))}

/* ===== FULLSCREEN ===== */
.tienda-box:fullscreen,.tienda-box.is-fullscreen{width:100vw;height:100vh;max-width:none;max-height:none;border-radius:0;border:none;padding:10px;aspect-ratio:auto;background:#0a0a14;display:flex;flex-direction:column;gap:8px;overflow:hidden;min-height:0;margin:0}
.tienda-box.is-fullscreen{position:fixed;inset:0;z-index:9500}
.tienda-box:fullscreen .tienda-titulo,.tienda-box.is-fullscreen .tienda-titulo{color:#f1c40f;font-size:1.1rem;margin-bottom:2px}
.tienda-box:fullscreen .tienda-temas,.tienda-box.is-fullscreen .tienda-temas{max-width:100%;margin-bottom:4px}
.tienda-box:fullscreen .tienda-captura,.tienda-box.is-fullscreen .tienda-captura{flex:1;min-height:0;width:100%;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;box-shadow:none;border-radius:0;overflow:hidden}
.tienda-box:fullscreen .tienda-escenario,.tienda-box.is-fullscreen .tienda-escenario{border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.6);max-width:none;max-height:none}
.tienda-box:fullscreen .tienda-catalogo,.tienda-box.is-fullscreen .tienda-catalogo,.tienda-box:fullscreen .tienda-acciones,.tienda-box.is-fullscreen .tienda-acciones{flex:0 0 auto;max-width:100%}
.tienda-box:fullscreen .tienda-items,.tienda-box.is-fullscreen .tienda-items{max-height:110px}
.tienda-box:fullscreen .btn-expand-store,.tienda-box.is-fullscreen .btn-expand-store{top:12px;right:12px}

/* ===== GALERÍA ===== */
.galeria-tiendas{max-width:1200px;margin:0 auto 24px;background:var(--tarjeta-bg);border:2px solid var(--dorado);border-radius:18px;padding:14px;box-shadow:0 10px 24px var(--sombra)}
.galeria-tiendas h3{color:var(--rojo);font-size:1rem;margin-bottom:12px;text-align:center;text-transform:uppercase;letter-spacing:.5px}
.galeria-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.galeria-vacia{grid-column:1 / -1;text-align:center;color:var(--texto-suave);font-size:.88rem;padding:20px 10px;font-style:italic}
.tienda-thumb{position:relative;background:var(--fondo);border:1px solid var(--borde);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.tienda-thumb:hover{transform:translateY(-2px);box-shadow:0 6px 14px var(--sombra)}
.tienda-thumb img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover}
.tienda-thumb-info{padding:6px 8px;background:var(--tarjeta-bg)}
.tienda-thumb-nombre{font-size:.78rem;font-weight:800;color:var(--texto);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tienda-thumb-fecha{font-size:.65rem;color:var(--texto-suave)}
.tienda-thumb-borrar{position:absolute;top:4px;right:4px;background:rgba(231,76,60,.9);color:#fff;border:none;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:.8rem;display:flex;align-items:center;justify-content:center;z-index:2}
.tienda-thumb-borrar:hover{background:#c0392b;transform:scale(1.1)}

/* ===== MODAL ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);justify-content:center;align-items:center;z-index:99997;padding:15px;overflow-y:auto;backdrop-filter:blur(4px)}
.modal-overlay.activo{display:flex}
.modal-contenido{background:var(--modal-bg);padding:26px;border-radius:20px;width:100%;max-width:960px;max-height:calc(100vh - 40px);overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.55);border:3px solid var(--dorado);position:relative;margin:auto;animation:modalIn .25s ease-out}
@keyframes modalIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-contenido h2{color:var(--rojo);margin-bottom:18px;text-align:center;font-size:1.35rem}
.modal-contenido label{display:block;margin-top:14px;font-weight:700;color:var(--verde);font-size:.9rem}
.modal-contenido input[type="text"]{width:100%;padding:11px 14px;margin-top:6px;border:2px solid var(--input-border);background:var(--input-bg);color:var(--texto);border-radius:10px;font-family:inherit;font-size:.95rem}
.modal-contenido input:focus{outline:none;border-color:var(--dorado);box-shadow:0 0 0 3px rgba(212,175,55,.15)}
.botones-modal{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap;align-items:center}
.btn-guardar,.btn-cancelar{border:none;padding:11px 22px;border-radius:26px;font-size:.92rem;cursor:pointer;font-weight:700}
.btn-guardar{background:var(--verde);color:#fff}
.btn-guardar:hover{background:var(--verde-hover);transform:translateY(-1px)}
.btn-cancelar{background:#95a5a6;color:#fff}
.btn-cancelar:hover{background:#7f8c8d}

/* ===== LIGHTBOX ===== */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:99998;justify-content:center;align-items:center;cursor:zoom-out;padding:20px}
.lightbox.activo{display:flex}
.lightbox img{max-width:95%;max-height:90vh;border-radius:10px;box-shadow:0 0 40px rgba(255,255,255,.25)}

/* ===== TOASTS ===== */
#toastContainer{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:10px;pointer-events:none;align-items:center}
.toast{background:#333;color:#fff;padding:12px 22px;border-radius:30px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:toastEntrar .3s ease-out;max-width:90vw;text-align:center;font-size:.9rem}
.toast-success{background:var(--verde)}
.toast-error{background:var(--rojo)}
.toast-info{background:#3498db}
.toast.salir{animation:toastSalir .3s ease-in forwards}
@keyframes toastEntrar{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastSalir{to{opacity:0;transform:translateY(20px)}}

/* ===== AVISO SUPABASE ===== */
#avisoSupabase{display:none;max-width:1200px;margin:0 auto 16px;background:#e67e22;color:#fff;padding:14px 18px;border-radius:12px;font-size:.9rem;border-left:5px solid #d35400}
#avisoSupabase.activo{display:block}
#avisoSupabase code{background:rgba(0,0,0,.2);padding:2px 6px;border-radius:4px}

@media(max-width:600px){
  body{padding:12px}
  .modal-contenido{padding:18px;max-height:calc(100vh - 16px);border-radius:16px}
  .tienda-items{grid-template-columns:repeat(auto-fill,minmax(60px,1fr));max-height:120px}
  .item-catalogo svg{width:34px;height:34px}
  .galeria-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .tienda-rotulo-texto{font-size:8px;letter-spacing:.5px}
  .tienda-item{width:13%}
  .tienda-item-precio{font-size:5px;bottom:-10%}
  .btn-expand-store{top:10px;right:10px;width:30px;height:30px;font-size:.95rem}
  .tienda-ventana{left:30%;right:30%}
  .tienda-mostrador{width:58%;height:22%}
  .tema-btn{font-size:.68rem;padding:4px 8px}
}
</style>

/* ============ FUNCIONES TIENDA ============ */
function buscarItemPorId(id) { for (let i = 0; i < TIENDA_CATALOGO.length; i++) { const f = TIENDA_CATALOGO[i].items.find(it => it.id===id); if (f) return f; } return null; }
function cargarTemaTienda() { try { const t = localStorage.getItem(STORAGE_TEMA_TIENDA); if (t && TEMAS_TIENDA.some(x => x.id === t)) temaTiendaActual = t; } catch(e){} }
function aplicarTemaTienda(id) {
    if (!TEMAS_TIENDA.some(x => x.id === id)) return;
    temaTiendaActual = id;
    const escenario = document.getElementById('tiendaEscenario');
    if (escenario) escenario.setAttribute('data-tema', id);
    try { localStorage.setItem(STORAGE_TEMA_TIENDA, id); } catch(e){}
    document.querySelectorAll('.tema-btn').forEach(b => b.classList.toggle('activo', b.dataset.tema === id));
}
function renderizarTemasTienda() {
    const cont = document.getElementById('tiendaTemas');
    if (!cont) return;
    cont.innerHTML = TEMAS_TIENDA.map(t => '<button type="button" class="tema-btn '+(t.id === temaTiendaActual ? 'activo' : '')+'" data-tema="'+t.id+'" role="tab">'+t.nombre+'</button>').join('');
    cont.querySelectorAll('.tema-btn').forEach(btn => btn.addEventListener('click', () => {
        aplicarTemaTienda(btn.dataset.tema);
        toast('Tema: '+(TEMAS_TIENDA.find(x => x.id === btn.dataset.tema) || {}).nombre, 'success');
    }));
}
function renderizarTabs() {
    const cont = document.getElementById('tiendaTabs');
    if (!cont) return;
    cont.innerHTML = TIENDA_CATALOGO.map(cat => '<button class="tab-categoria '+(cat.id === categoriaActual ? 'activo' : '')+'" data-cat="'+cat.id+'" type="button">'+cat.nombre+'</button>').join('');
    cont.querySelectorAll('.tab-categoria').forEach(btn => btn.addEventListener('click', () => {
        categoriaActual = btn.dataset.cat; renderizarTabs(); renderizarItemsCatalogo();
    }));
}
function renderizarItemsCatalogo() {
    const cont = document.getElementById('tiendaItems');
    if (!cont) return;
    const cat = TIENDA_CATALOGO.find(c => c.id === categoriaActual);
    if (!cat) { cont.innerHTML = ''; return; }
    cont.innerHTML = cat.items.map(item => {
        let preview = item.tipo === 'texto' ? '<div class="rotulo-mini"><div class="rotulo '+item.clase+'">'+escapeHtml(item.texto)+'</div></div>' : item.svg;
        const precioHtml = item.precio ? '<div class="item-precio">'+formatearColones(item.precio)+'</div>' : '';
        return '<div class="item-catalogo" data-item="'+item.id+'" title="'+escapeHtml(item.nombre)+' - '+formatearColones(item.precio||0)+'">'+preview+'<div class="item-nombre">'+escapeHtml(item.nombre)+'</div>'+precioHtml+'</div>';
    }).join('');
    cont.querySelectorAll('.item-catalogo').forEach(el => el.addEventListener('click', () => colocarEnSiguienteSlotLibre(el.dataset.item)));
}
function cargarTiendaState() {
    try {
        const raw = localStorage.getItem(STORAGE_TIENDA_ACTUAL);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (!data || typeof data !== 'object') return;
        if (Array.isArray(data.items)) { tiendaState.items = data.items; tiendaRotulo = (typeof data.rotulo === 'string' && data.rotulo.trim()) ? data.rotulo.slice(0,30) : 'Mi Tienda Navideña'; return; }
        oldSlotsToMigrate = data;
    } catch(e){}
}
function migrarSlotsViejos() {
    if (!oldSlotsToMigrate) return;
    const escenario = document.getElementById('tiendaEscenario');
    if (!escenario) return;
    const escRect = escenario.getBoundingClientRect();
    if (escRect.width < 10) return;
    const newItems = [];
    Object.keys(oldSlotsToMigrate).forEach(slotId => {
        const itemId = oldSlotsToMigrate[slotId];
        if (!itemId) return;
        const zone = document.querySelector('.slot-zone[data-slot="'+slotId+'"]');
        if (!zone) return;
        const zr = zone.getBoundingClientRect();
        if (zr.width === 0) return;
        newItems.push({ id:itemId, x:((zr.left+zr.width/2-escRect.left)/escRect.width)*100, y:((zr.top+zr.height/2-escRect.top)/escRect.height)*100, scale:1, rotation:0 });
    });
    tiendaState.items = newItems; oldSlotsToMigrate = null; guardarTiendaState();
}
function guardarTiendaState() { try { localStorage.setItem(STORAGE_TIENDA_ACTUAL, JSON.stringify({items:tiendaState.items, rotulo:tiendaRotulo})); } catch(e){} }
function actualizarRotulo() { const el = document.getElementById('tiendaRotuloTexto'); if (el) el.textContent = tiendaRotulo; }
function editarRotulo() {
    const nuevo = prompt('Nombre de su tienda (máx. 30 caracteres):', tiendaRotulo);
    if (nuevo === null) return;
    tiendaRotulo = String(nuevo).trim().slice(0,30) || 'Mi Tienda Navideña';
    actualizarRotulo(); guardarTiendaState(); toast('Rótulo actualizado', 'success');
}
function computeSlotZones() {
    const escenario = document.getElementById('tiendaEscenario');
    if (!escenario) { slotZonesPercent = []; return; }
    const escRect = escenario.getBoundingClientRect();
    if (escRect.width < 10 || escRect.height < 10) { slotZonesPercent = []; return; }
    slotZonesPercent = [];
    document.querySelectorAll('.slot-zone').forEach(zone => {
        const zr = zone.getBoundingClientRect();
        if (zr.width === 0 || zr.height === 0) return;
        slotZonesPercent.push({
            id: zone.dataset.slot || '',
            left:((zr.left-escRect.left)/escRect.width)*100,
            top:((zr.top-escRect.top)/escRect.height)*100,
            right:((zr.right-escRect.left)/escRect.width)*100,
            bottom:((zr.bottom-escRect.top)/escRect.height)*100
        });
    });
}
function obtenerSlotDeItem(x, y) {
    if (!slotZonesPercent || slotZonesPercent.length === 0) return null;
    for (let i = 0; i < slotZonesPercent.length; i++) {
        const z = slotZonesPercent[i];
        if (x >= z.left && x <= z.right && y >= z.top && y <= z.bottom) return z;
    }
    return null;
}
function calcularZIndex(item) {
    const slot = obtenerSlotDeItem(item.x, item.y);
    const escala = (item.scale != null && item.scale > 0) ? item.scale : 1;
    let tier;
    if (slot && /^mesa/.test(slot.id)) tier = 3;
    else if (slot && /^t[12]r/.test(slot.id)) tier = 1;
    else tier = 2;
    return tier * 10000 + Math.max(0, Math.min(1000, Math.round((6 - escala) * 100)));
}
function actualizarTodosZIndex() {
    document.querySelectorAll('.tienda-item').forEach(el => { if (el._itemRef) el.style.zIndex = calcularZIndex(el._itemRef); });
}
function estaEnSlot(x, y) {
    if (!slotZonesPercent || slotZonesPercent.length === 0) return false;
    return slotZonesPercent.some(z => x >= z.left && x <= z.right && y >= z.top && y <= z.bottom);
}
function calcularTotalTienda() {
    let total = 0;
    tiendaState.items.forEach(item => {
        if (!estaEnSlot(item.x, item.y)) return;
        const itemDef = buscarItemPorId(item.id);
        if (itemDef && typeof itemDef.precio === 'number') total += itemDef.precio;
    });
    return total;
}
function actualizarTotalCaja() { const el = document.getElementById('cajaTotal'); if (el) el.textContent = formatearColones(calcularTotalTienda()); }

function colocarEnSiguienteSlotLibre(itemId) {
    let x = 50, y = 50, intentos = 0;
    while (intentos < 40) {
        const ocupado = tiendaState.items.some(it => Math.hypot(it.x - x, it.y - y) < 3);
        if (!ocupado) break;
        const angulo = intentos * 2.399963229728653;
        const radio = 3 + Math.floor(intentos / 8) * 3;
        x = Math.max(5, Math.min(95, 50 + Math.cos(angulo) * radio));
        y = Math.max(5, Math.min(95, 50 + Math.sin(angulo) * radio));
        intentos++;
    }
    tiendaState.items.push({id:itemId, x:x, y:y, scale:1, rotation:0});
    guardarTiendaState(); renderizarEscenario();
    toast('Añadido al centro: '+(buscarItemPorId(itemId)||{}).nombre, 'success');
}

function renderizarEscenario() {
    actualizarRotulo();
    const layer = document.getElementById('itemsLayer');
    if (!layer) return;
    layer.innerHTML = '';
    tiendaState.items = tiendaState.items.filter(it => !!buscarItemPorId(it.id));
    computeSlotZones();
    const created = [];
    tiendaState.items.forEach((item, idx) => {
        if (item.rotation === undefined) item.rotation = 0;
        if (item.scale === undefined) item.scale = 1;
        const itemDef = buscarItemPorId(item.id);
        if (!itemDef) return;
        const el = crearItemElemento(item, itemDef, idx);
        layer.appendChild(el);
        created.push({ el:el, item:item });
    });
    requestAnimationFrame(() => {
        computeSlotZones();
        created.forEach(c => {
            c.el.classList.toggle('en-slot', estaEnSlot(c.item.x, c.item.y));
            c.el.style.zIndex = calcularZIndex(c.item);
        });
        actualizarTotalCaja();
    });
}
function aplicarTransform(el, item) { el.style.transform = 'translate(-50%, -50%) rotate('+(item.rotation||0)+'deg) scale('+(item.scale||1)+')'; }
function crearItemElemento(item, itemDef, idx) {
    const el = document.createElement('div');
    el.className = 'tienda-item';
    el.style.left = item.x+'%'; el.style.top = item.y+'%';
    aplicarTransform(el, item);
    el._itemRef = item;
    el.style.zIndex = calcularZIndex(item);
    el.dataset.index = idx;
    const contentHtml = itemDef.tipo === 'texto' ? '<div class="rotulo '+itemDef.clase+'">'+escapeHtml(itemDef.texto)+'</div>' : itemDef.svg;
    const precio = itemDef.precio ? formatearColones(itemDef.precio) : '';
    el.innerHTML = '<div class="tienda-item-content">'+contentHtml+'</div>'+
        (precio ? '<div class="tienda-item-precio">'+precio+'</div>' : '')+
        '<button class="item-rotate" type="button" title="Rotar 45°" aria-label="Rotar">⟳</button>'+
        '<button class="item-delete" type="button" title="Eliminar" aria-label="Eliminar">×</button>';
    attachItemInteractions(el, item, idx);
    return el;
}
function attachItemInteractions(el, item, idx) {
    const pointers = new Map();
    let mode = null, dragStart = null, pinchStart = null, moved = false;
    el._cancelDrag = () => { pointers.clear(); el.classList.remove('dragging'); el.style.zIndex = calcularZIndex(item); mode = null; dragStart = null; pinchStart = null; moved = false; };
    function getPinchInfo() {
        const pts = Array.from(pointers.values());
        if (pts.length < 2) return null;
        const a = pts[0], b = pts[1];
        return { dist: Math.hypot(b.x-a.x, b.y-a.y), angle: Math.atan2(b.y-a.y, b.x-a.x) };
    }
    el.addEventListener('pointerdown', e => {
        if (pinchActive) return;
        if (e.target.closest('.item-delete') || e.target.closest('.item-rotate')) return;
        pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
        try { el.setPointerCapture(e.pointerId); } catch(err){}
        if (pointers.size === 1) {
            const p = pointers.get(e.pointerId);
            dragStart = {x:p.x, y:p.y, itemX:item.x, itemY:item.y};
            mode = 'drag'; moved = false; el.classList.add('dragging');
        } else if (pointers.size === 2) {
            const info = getPinchInfo();
            if (info) { pinchStart = {dist:info.dist, angle:info.angle, scale:item.scale||1, rotation:item.rotation||0}; mode='pinch'; moved=true; }
        }
    });
    el.addEventListener('pointermove', e => {
        if (pinchActive) return;
        if (!pointers.has(e.pointerId)) return;
        pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
        if (mode === 'drag' && pointers.size === 1) {
            const p = pointers.get(e.pointerId);
            const dx = p.x - dragStart.x, dy = p.y - dragStart.y;
            if (!moved && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) moved = true;
            if (!moved) return;
            const escRect = document.getElementById('tiendaEscenario').getBoundingClientRect();
            item.x = Math.max(2, Math.min(98, dragStart.itemX + (dx/escRect.width)*100));
            item.y = Math.max(2, Math.min(98, dragStart.itemY + (dy/escRect.height)*100));
            el.style.left = item.x+'%'; el.style.top = item.y+'%';
            el.classList.toggle('en-slot', estaEnSlot(item.x, item.y));
            el.style.zIndex = calcularZIndex(item);
            actualizarTotalCaja();
        } else if (mode === 'pinch' && pointers.size >= 2) {
            const info = getPinchInfo();
            if (!info) return;
            item.scale = Math.max(0.4, Math.min(5, pinchStart.scale * (info.dist / pinchStart.dist)));
            item.rotation = ((pinchStart.rotation + (info.angle - pinchStart.angle) * 180 / Math.PI) % 360 + 360) % 360;
            aplicarTransform(el, item);
            el.style.zIndex = calcularZIndex(item);
        }
    });
    function onUp(e) {
        if (!pointers.has(e.pointerId)) return;
        pointers.delete(e.pointerId);
        try { el.releasePointerCapture(e.pointerId); } catch(err){}
        if (pointers.size === 0) {
            el.classList.remove('dragging');
            if (mode === 'drag' && !moved) {
                const steps = BIG_SCALE_IDS.has(item.id) ? [1,1.5,2,3,4,5,0.75] : [1,1.5,2,0.75];
                const curIdx = steps.indexOf(item.scale || 1);
                item.scale = steps[(curIdx + 1) % steps.length];
                aplicarTransform(el, item);
                toast('Escala: '+Math.round(item.scale*100)+'%', 'info');
            }
            el.style.zIndex = calcularZIndex(item);
            guardarTiendaState(); actualizarTotalCaja();
            mode = null; dragStart = null; pinchStart = null; moved = false;
        } else if (pointers.size === 1) {
            const p = Array.from(pointers.values())[0];
            dragStart = {x:p.x, y:p.y, itemX:item.x, itemY:item.y};
            mode = 'drag'; moved = true; pinchStart = null;
        }
    }
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', onUp);
    const delBtn = el.querySelector('.item-delete');
    if (delBtn) {
        delBtn.addEventListener('pointerdown', e => e.stopPropagation());
        delBtn.addEventListener('click', e => {
            e.stopPropagation();
            tiendaState.items.splice(idx, 1);
            guardarTiendaState(); renderizarEscenario();
            toast('Objeto eliminado', 'success');
        });
    }
    const rotBtn = el.querySelector('.item-rotate');
    if (rotBtn) {
        rotBtn.addEventListener('pointerdown', e => e.stopPropagation());
        rotBtn.addEventListener('click', e => {
            e.stopPropagation();
            item.rotation = ((item.rotation||0) + 45) % 360;
            aplicarTransform(el, item); guardarTiendaState();
            toast('Rotación: '+item.rotation+'°', 'info');
        });
    }
}

/* ============ ZOOM + PAN ESCENARIO ============ */
function applyEscenarioView(animate) {
    const esc = document.getElementById('tiendaEscenario');
    if (!esc) return;
    if (!animate) esc.style.transition = 'none';
    esc.style.transform = 'translate('+viewPanX+'px, '+viewPanY+'px) scale('+viewZoom+')';
    const ind = document.getElementById('tiendaZoomIndicator');
    if (ind) { ind.textContent = '🔍 '+viewZoom.toFixed(1)+'x'; ind.classList.toggle('visible', viewZoom > 1.05); }
    if (!esc.dataset.panning) esc.style.cursor = viewZoom > 1.01 ? 'grab' : '';
    if (!animate) requestAnimationFrame(() => { esc.style.transition = ''; });
}
function resetEscenarioZoom(animate) { viewZoom = 1; viewPanX = 0; viewPanY = 0; applyEscenarioView(animate); }
function clampPan() {
    const esc = document.getElementById('tiendaEscenario');
    if (!esc) return;
    const w = esc.offsetWidth, h = esc.offsetHeight;
    if (w < 10 || h < 10) return;
    if (viewZoom <= 1.001) { viewPanX = 0; viewPanY = 0; return; }
    viewPanX = Math.max(-(viewZoom - 1) * w, Math.min(0, viewPanX));
    viewPanY = Math.max(-(viewZoom - 1) * h, Math.min(0, viewPanY));
}
function initEscenarioZoom() {
    const esc = document.getElementById('tiendaEscenario');
    if (!esc) return;
    const escPointers = new Map();
    let escPinch = null, lastTapTime = 0, lastTapPos = null;
    let isPanning = false, didPan = false, panPointerId = null, panStartX = 0, panStartY = 0, panStartViewPanX = 0, panStartViewPanY = 0;
    function startPan(e) {
        isPanning = true; didPan = false; panPointerId = e.pointerId;
        panStartX = e.clientX; panStartY = e.clientY;
        panStartViewPanX = viewPanX; panStartViewPanY = viewPanY;
        esc.dataset.panning = '1'; esc.style.cursor = 'grabbing';
        try { esc.setPointerCapture(e.pointerId); } catch(err){}
    }
    function endPan() {
        if (!isPanning) return;
        isPanning = false; delete esc.dataset.panning;
        esc.style.cursor = viewZoom > 1.01 ? 'grab' : '';
        if (panPointerId !== null) { try { esc.releasePointerCapture(panPointerId); } catch(err){} panPointerId = null; }
    }
    esc.addEventListener('pointerdown', e => {
        if (e.target.closest('.item-delete') || e.target.closest('.item-rotate')) return;
        escPointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
        if (escPointers.size === 2) {
            e.preventDefault();
            document.querySelectorAll('.tienda-item.dragging').forEach(item => { if (item._cancelDrag) item._cancelDrag(); });
            pinchActive = true; endPan(); didPan = false;
            const pts = Array.from(escPointers.values());
            const a = pts[0], b = pts[1];
            const parent = esc.parentElement, parentRect = parent.getBoundingClientRect();
            const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
            const cxLayout = cx - parentRect.left - esc.offsetLeft;
            const cyLayout = cy - parentRect.top - esc.offsetTop;
            escPinch = { initialDist: Math.hypot(b.x-a.x, b.y-a.y) || 1, initialZoom: viewZoom, initialPanX: viewPanX, initialPanY: viewPanY, initialCenterInLayoutX: cxLayout, initialCenterInLayoutY: cyLayout };
        } else if (escPointers.size === 1) {
            if (viewZoom > 1.01 && !e.target.closest('.tienda-item') && !e.target.closest('.tienda-rotulo') && !e.target.closest('.btn-expand-store')) {
                e.preventDefault(); startPan(e);
            }
        }
    }, true);
    esc.addEventListener('pointermove', e => {
        if (!escPointers.has(e.pointerId)) return;
        escPointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
        if (escPointers.size === 2 && escPinch) {
            e.preventDefault();
            const pts = Array.from(escPointers.values());
            const a = pts[0], b = pts[1];
            const newZoom = Math.max(VIEW_MIN_ZOOM, Math.min(VIEW_MAX_ZOOM, escPinch.initialZoom * (Math.hypot(b.x-a.x, b.y-a.y) / escPinch.initialDist)));
            const parent = esc.parentElement, parentRect = parent.getBoundingClientRect();
            const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
            const cxLayout = cx - parentRect.left - esc.offsetLeft;
            const cyLayout = cy - parentRect.top - esc.offsetTop;
            const worldX = (escPinch.initialCenterInLayoutX - escPinch.initialPanX) / escPinch.initialZoom;
            const worldY = (escPinch.initialCenterInLayoutY - escPinch.initialPanY) / escPinch.initialZoom;
            viewZoom = newZoom;
            viewPanX = cxLayout - worldX * newZoom;
            viewPanY = cyLayout - worldY * newZoom;
            clampPan(); applyEscenarioView(false);
        } else if (isPanning && escPointers.size === 1 && e.pointerId === panPointerId) {
            const dx = e.clientX - panStartX, dy = e.clientY - panStartY;
            if (!didPan && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) didPan = true;
            if (didPan) {
                e.preventDefault();
                const w = esc.offsetWidth, h = esc.offsetHeight;
                const minX = -(viewZoom - 1) * w, minY = -(viewZoom - 1) * h;
                const rawPanX = panStartViewPanX + dx, rawPanY = panStartViewPanY + dy;
                const clampedX = Math.max(minX, Math.min(0, rawPanX));
                const clampedY = Math.max(minY, Math.min(0, rawPanY));
                if (rawPanX !== clampedX) { panStartViewPanX = clampedX; panStartX = e.clientX; }
                if (rawPanY !== clampedY) { panStartViewPanY = clampedY; panStartY = e.clientY; }
                viewPanX = clampedX; viewPanY = clampedY;
                applyEscenarioView(false);
            }
        }
    }, {passive:false});
    esc.addEventListener('pointerup', e => {
        if (e.pointerId === panPointerId) { const wasPanning = didPan; endPan(); didPan = false; if (wasPanning) return; }
        if (escPointers.size > 1) return;
        if (pinchActive) return;
        if (e.target.closest('.tienda-item')) return;
        if (e.target.closest('.item-delete') || e.target.closest('.item-rotate')) return;
        if (e.target.closest('.tienda-rotulo')) return;
        if (e.target.closest('.btn-expand-store')) return;
        const now = Date.now();
        if (now - lastTapTime < 300 && lastTapPos && viewZoom > 1.05) {
            const d = Math.hypot(e.clientX - lastTapPos.x, e.clientY - lastTapPos.y);
            if (d < 30) resetEscenarioZoom(true);
        }
        lastTapTime = now; lastTapPos = {x:e.clientX, y:e.clientY};
    });
    esc.addEventListener('pointercancel', e => { if (e.pointerId === panPointerId) { endPan(); didPan = false; } });
    document.addEventListener('pointerup', e => {
        escPointers.delete(e.pointerId);
        if (escPointers.size < 2) { escPinch = null; if (pinchActive) setTimeout(() => pinchActive = false, 80); }
    });
    document.addEventListener('pointercancel', e => {
        escPointers.delete(e.pointerId);
        if (escPointers.size < 2) { escPinch = null; if (pinchActive) setTimeout(() => pinchActive = false, 80); }
    });
    esc.addEventListener('wheel', e => {
        if (pinchActive) return;
        let delta = e.deltaY;
        if (e.deltaMode === 1) delta *= 20;
        else if (e.deltaMode === 2) delta *= 400;
        const newZoom = Math.max(VIEW_MIN_ZOOM, Math.min(VIEW_MAX_ZOOM, viewZoom * Math.exp(-delta * 0.0015)));
        if (Math.abs(newZoom - viewZoom) < 0.0001) return;
        e.preventDefault();
        const parent = esc.parentElement, parentRect = parent.getBoundingClientRect();
        const cxLayout = e.clientX - parentRect.left - esc.offsetLeft;
        const cyLayout = e.clientY - parentRect.top - esc.offsetTop;
        const worldX = (cxLayout - viewPanX) / viewZoom;
        const worldY = (cyLayout - viewPanY) / viewZoom;
        if (newZoom <= VIEW_MIN_ZOOM + 0.001) { viewZoom = VIEW_MIN_ZOOM; viewPanX = 0; viewPanY = 0; }
        else { viewZoom = newZoom; viewPanX = cxLayout - worldX * newZoom; viewPanY = cyLayout - worldY * newZoom; clampPan(); }
        applyEscenarioView(false);
    }, { passive: false });
}

/* ============ CAPTURA PNG / SUPABASE TIENDAS ============ */
function normalizarA1a1(source, size, bgColor) {
    const out = document.createElement('canvas'); out.width = size; out.height = size;
    const ctx = out.getContext('2d');
    ctx.fillStyle = bgColor || '#0e3a1c'; ctx.fillRect(0, 0, size, size);
    const scale = Math.min(size/source.width, size/source.height);
    const dw = source.width*scale, dh = source.height*scale;
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(source, (size-dw)/2, (size-dh)/2, dw, dh);
    return out;
}
function dibujarFooterEnCanvas(canvas, nombreCreador) {
    const ctx = canvas.getContext('2d');
    const fecha = new Date().toLocaleDateString('es-CR');
    const temaNombre = (TEMAS_TIENDA.find(t => t.id===temaTiendaActual) || {}).nombre || '';
    const footerH = Math.round(canvas.height * 0.06);
    const grad = ctx.createLinearGradient(0, canvas.height-footerH, canvas.width, canvas.height);
    grad.addColorStop(0, 'rgba(26,92,42,0.92)');
    grad.addColorStop(0.5, 'rgba(46,158,63,0.92)');
    grad.addColorStop(1, 'rgba(192,57,43,0.92)');
    ctx.fillStyle = grad; ctx.fillRect(0, canvas.height-footerH, canvas.width, footerH);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold '+Math.round(canvas.height*0.022)+'px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 4;
    ctx.fillText('🎄 Creado por: '+nombreCreador+'  ·  '+fecha+'  ·  '+temaNombre+' 🎄', canvas.width/2, canvas.height-footerH/2);
    ctx.shadowBlur = 0;
}
async function capturarEscenario() {
    const escenario = document.getElementById('tiendaEscenario');
    const expandBtn = document.getElementById('btnExpandStore');
    const zoomInd = document.getElementById('tiendaZoomIndicator');
    const prevExpand = expandBtn ? expandBtn.style.display : '';
    const prevZoomInd = zoomInd ? zoomInd.style.display : '';
    if (expandBtn) expandBtn.style.display = 'none';
    if (zoomInd) zoomInd.style.display = 'none';
    const prevZoom = viewZoom, prevPanX = viewPanX, prevPanY = viewPanY;
    viewZoom = 1; viewPanX = 0; viewPanY = 0;
    applyEscenarioView(false);
    try {
        await new Promise(r => setTimeout(r, 180));
        return await html2canvas(escenario, { backgroundColor:'#0e3a1c', scale:2, useCORS:true, allowTaint:false, logging:false, imageTimeout:8000 });
    } finally {
        if (expandBtn) expandBtn.style.display = prevExpand || '';
        if (zoomInd) zoomInd.style.display = prevZoomInd || '';
        viewZoom = prevZoom; viewPanX = prevPanX; viewPanY = prevPanY;
        applyEscenarioView(false);
    }
}
async function subirTiendaASupabase(nombreCreador, jpgBlob) {
    if (!supabaseDisponible || !jpgBlob) return null;
    try {
        const fileName = 'tienda_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.jpg';
        const upRes = await supabaseClient.storage.from(SUPABASE_BUCKET_TIENDAS).upload(fileName, jpgBlob, {contentType:'image/jpeg', cacheControl:'31536000', upsert:false});
        if (upRes.error) throw upRes.error;
        const urlRes = supabaseClient.storage.from(SUPABASE_BUCKET_TIENDAS).getPublicUrl(fileName);
        const publicUrl = urlRes.data && urlRes.data.publicUrl;
        if (!publicUrl) throw new Error('No se pudo obtener URL pública');
        const insRes = await supabaseClient.from('tiendas_guardadas').insert({nombre:nombreCreador, tema:temaTiendaActual, imagen_url:publicUrl, imagen_path:fileName}).select().single();
        if (insRes.error) throw insRes.error;
        return insRes.data;
    } catch (e) {
        console.error('subirTiendaASupabase:', e);
        toast('No se pudo subir a Supabase: '+(e.message || e), 'error');
        return null;
    }
}
async function capturarYGuardarTienda(nombreCreador) {
    toast('Generando imagen de la tienda...', 'info');
    try {
        const rawCanvas = await capturarEscenario();
        const square = normalizarA1a1(rawCanvas, CAPTURE_SIZE, '#0e3a1c');
        dibujarFooterEnCanvas(square, nombreCreador);
        const pngDataURL = square.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = pngDataURL;
        a.download = 'tienda-'+nombreCreador.replace(/\s+/g,'-')+'-'+temaTiendaActual+'-'+Date.now()+'.png';
        document.body.appendChild(a); a.click(); a.remove();
        let guardado = false;
        if (supabaseDisponible) {
            const jpgBlob = await new Promise(r => square.toBlob(r, 'image/jpeg', 0.92));
            guardado = !!(await subirTiendaASupabase(nombreCreador, jpgBlob));
        }
        if (!guardado) {
            const small = normalizarA1a1(rawCanvas, 800, '#0e3a1c');
            dibujarFooterEnCanvas(small, nombreCreador);
            guardarTiendaLocal(nombreCreador, small.toDataURL('image/jpeg', 0.85));
            toast('Guardado localmente (Supabase no disponible)', 'info');
        }
        await actualizarGaleriaDesdeSupabase();
        toast('¡Tienda guardada y descargada! 🎄', 'success');
    } catch (err) { console.error('Error al guardar tienda:', err); toast('No se pudo generar la imagen', 'error'); }
}
function guardarTiendaLocal(nombreCreador, jpgDataURL) {
    const tiendas = leerTiendasGuardadas();
    tiendas.unshift({id:'local_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), nombre:nombreCreador, fecha:new Date().toISOString(), imagen:jpgDataURL, tema:temaTiendaActual});
    if (tiendas.length > 30) tiendas.length = 30;
    try { localStorage.setItem(STORAGE_TIENDAS, JSON.stringify(tiendas)); }
    catch(e) { tiendas.splice(15); try { localStorage.setItem(STORAGE_TIENDAS, JSON.stringify(tiendas)); } catch(e2){} }
}
function leerTiendasGuardadas() { try { const raw = localStorage.getItem(STORAGE_TIENDAS); const arr = raw ? JSON.parse(raw) : []; return Array.isArray(arr) ? arr : []; } catch(e) { return []; } }
async function cargarTiendasGuardadas() {
    let remote = [];
    if (supabaseDisponible) {
        try {
            const res = await supabaseClient.from('tiendas_guardadas').select('id,nombre,tema,imagen_url,imagen_path,fecha').order('fecha', {ascending:false}).limit(60);
            if (!res.error && Array.isArray(res.data)) remote = res.data;
        } catch(e) {}
    }
    const locales = leerTiendasGuardadas();
    const idsRemotos = new Set(remote.map(t => String(t.id)));
    const soloLocales = locales.filter(t => !idsRemotos.has(String(t.id)));
    const merged = remote.concat(soloLocales);
    merged.sort((a,b) => new Date(b.fecha||0) - new Date(a.fecha||0));
    const result = merged.slice(0, 60);
    try { localStorage.setItem(STORAGE_TIENDAS, JSON.stringify(result)); } catch(e){}
    return result;
}
function renderGaleriaCon(tiendas) {
    const cont = document.getElementById('galeriaTiendas');
    if (!cont) return;
    if (!tiendas || tiendas.length === 0) { cont.innerHTML = '<p class="galeria-vacia">🎄 Aún no hay tiendas creadas. ¡Cree la suya y pulse "Guardar PNG"!</p>'; return; }
    cont.innerHTML = tiendas.map(t => {
        const imgSrc = t.imagen_url || t.imagen || '';
        const temaStr = t.tema ? escapeHtml((TEMAS_TIENDA.find(x => x.id===t.tema)||{}).nombre || '') : '';
        return '<div class="tienda-thumb" data-id="'+escapeHtml(t.id)+'" data-url="'+escapeHtml(imgSrc)+'"><button class="tienda-thumb-borrar" data-id="'+escapeHtml(t.id)+'" type="button" title="Eliminar tienda">🗑️</button><img src="'+escapeHtml(imgSrc)+'" alt="'+escapeHtml(t.nombre)+'" loading="lazy" onerror="this.onerror=null;this.src=\''+PLACEHOLDER_IMG+'\'"><div class="tienda-thumb-info"><div class="tienda-thumb-nombre">'+escapeHtml(t.nombre)+'</div><div class="tienda-thumb-fecha">'+escapeHtml(formatearFechaCorta(t.fecha))+(temaStr ? ' · '+temaStr : '')+'</div></div></div>';
    }).join('');
    cont.querySelectorAll('.tienda-thumb').forEach(thumb => thumb.addEventListener('click', e => {

        if (url) { const lb = document.getElementById('lightbox'), lbImg = document.getElementById('lightboxImg'); lbImg.src = url; lb.classList.add('activo'); }
    }));
    cont.querySelectorAll('.tienda-thumb-borrar').forEach(btn => btn.addEventListener('click', e => {
        e.stopPropagation(); if (btn.dataset.id) eliminarTiendaGuardada(btn.dataset.id);
    }));
}
function renderizarGaleriaTiendas() { renderGaleriaCon(leerTiendasGuardadas()); actualizarGaleriaDesdeSupabase(); }
async function actualizarGaleriaDesdeSupabase() { renderGaleriaCon(await cargarTiendasGuardadas()); }
async function eliminarTiendaGuardada(id) {
    if (!id) return;
    if (!confirm('¿Eliminar esta tienda guardada?')) return;
    const tiendas = await cargarTiendasGuardadas();
    const t = tiendas.find(x => String(x.id) === String(id));
    if (supabaseDisponible && t && t.imagen_path) {
        try { await supabaseClient.storage.from(SUPABASE_BUCKET_TIENDAS).remove([t.imagen_path]); } catch(e) {}
        try { await supabaseClient.from('tiendas_guardadas').delete().eq('id', t.id); } catch(e) {}
    }
    const locales = leerTiendasGuardadas().filter(x => String(x.id) !== String(id));
    try { localStorage.setItem(STORAGE_TIENDAS, JSON.stringify(locales)); } catch(e){}
    toast('Tienda eliminada', 'success');
    await actualizarGaleriaDesdeSupabase();
}

    const rect = captura.getBoundingClientRect();
    if (rect.width < 10 || rect.height < 10) return;
    let targetW = rect.width - 8, targetH = targetW;
    if (targetH > rect.height - 8) { targetH = rect.height - 8; targetW = targetH; }
    escenario.style.width = targetW+'px'; escenario.style.height = targetH+'px';
    resetEscenarioZoom(false);
    requestAnimationFrame(() => { computeSlotZones(); actualizarTotalCaja(); actualizarTodosZIndex(); });
}
function resetEscenarioSize() {
    const escenario = document.getElementById('tiendaBox') ? document.getElementById('tiendaBox').querySelector('.tienda-escenario') : null;
    if (escenario) { escenario.style.width = ''; escenario.style.height = ''; }
    resetEscenarioZoom(false);
    requestAnimationFrame(() => { computeSlotZones(); actualizarTotalCaja(); actualizarTodosZIndex(); });
}
async function toggleFullscreenTienda() {
    const el = document.getElementById('tiendaBox');
    if (!el) return;
    if (!el.classList.contains('is-fullscreen') && document.fullscreenElement !== el) {
        try { if (el.requestFullscreen) await el.requestFullscreen(); else { el.classList.add('is-fullscreen'); setTimeout(ajustarTamanoFullscreen, 50); } }
        catch(e) { el.classList.add('is-fullscreen'); setTimeout(ajustarTamanoFullscreen, 50); }
    } else {
        try { if (document.exitFullscreen) await document.exitFullscreen(); } catch(e){}
        el.classList.remove('is-fullscreen');
        resetEscenarioSize();
    }
}
document.getElementById('btnExpandStore').addEventListener('click', toggleFullscreenTienda);
document.addEventListener('fullscreenchange', () => {
    const el = document.getElementById('tiendaBox');
    if (document.fullscreenElement === el) setTimeout(ajustarTamanoFullscreen, 100);
    else { if (el) el.classList.remove('is-fullscreen'); resetEscenarioSize(); }
});
window.addEventListener('resize', () => {
    const el = document.getElementById('tiendaBox');
    if ((document.fullscreenElement === el) || (el && el.classList.contains('is-fullscreen'))) ajustarTamanoFullscreen();
    else { computeSlotZones(); actualizarTotalCaja(); actualizarTodosZIndex(); clampPan(); applyEscenarioView(false); }
});

/* ============ INICIALIZACIÓN ============ */
async function inicializar() {
    try {
        if (window.supabase && typeof window.supabase.createClient === 'function') {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            supabaseDisponible = true;
        }
    } catch(e) { console.error('Init Supabase:', e); }
    if (!supabaseDisponible) mostrarAvisoSetup();

    cargarTiendaState();
    cargarTemaTienda();
    renderizarTemasTienda();
    aplicarTemaTienda(temaTiendaActual);
    actualizarRotulo();
    renderizarTabs();
    renderizarItemsCatalogo();

    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    computeSlotZones();
    migrarSlotsViejos();
    renderizarEscenario();
    renderizarGaleriaTiendas();
    initEscenarioZoom();
    applyEscenarioView(false);

    const rotuloEl = document.getElementById('tiendaRotulo');
    if (rotuloEl) {
        rotuloEl.addEventListener('click', editarRotulo);
        rotuloEl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); editarRotulo(); } });
    }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', inicializar);
else inicializar();
</script>
