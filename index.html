<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Tienda Navideña · South Park</title>
<script>

  if (__s && __s.tema) document.documentElement.dataset.store = __s.tema;

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<style>
:root{--bg:#eef5fb;--tx:#1f2937;--card:#fff;--bd:#e5eaf0;--red:#c0392b;--grn:#2e9e3f;--gold:#d4af37;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-store="clasica"]     { --bg:#f5e6c8; --card:#fdf6e3; --bd:#e0d0a8; --tx:#3a2a14; }
:root[data-store="pasteleria"]  { --bg:#fdf0f5; --card:#fff5f9; --bd:#f0d0e0; --tx:#4a1a30; }
:root[data-store="jugueteria"]  { --bg:#142624; --card:#1e3330; --bd:#3a4a46; --tx:#e8f5f0; }
:root[data-store="supermercado"]{ --bg:#d8e2e8; --card:#ffffff; --bd:#c0d0dc; --tx:#1a3d5c; }
:root[data-store="mercado"]     { --bg:#3a2510; --card:#4a3218; --bd:#6a4a28; --tx:#f5e6c8; }
html{height:100%}*{box-sizing:border-box}
body{margin:0;min-height:100%;font-family:system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);padding:8px}
h1{text-align:center;color:var(--red);font-size:1.15rem;margin:4px 0 8px;text-transform:uppercase;letter-spacing:1px}
#box{max-width:960px;margin:auto;background:var(--card);border:2px solid var(--gold);border-radius:18px;padding:8px;position:relative}

/* ESCENARIO */
#st{
  --wall:#f5e6c8;--floor:#c99868;--shelf:#8b6f47;--sign:#8b6f47;--signc:#fdf6e3;
  position:relative;width:min(100%,900px);aspect-ratio:1;margin:auto;
  overflow:hidden;border-radius:10px;touch-action:pan-y;
  user-select:none;-webkit-user-select:none;
  box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.08);
  background:#000;
}
#st:fullscreen{
  width:min(100vw, 100vh);
  height:min(100vw, 100vh);
  max-width:none;max-height:none;
  border-radius:0;margin:0;
}
#st[data-t=pasteleria]{--wall:#fdf0f5;--floor:#f5e0e8;--shelf:#ffd0e0;--sign:#ffc0d4;--signc:#8b1a4f}
#st[data-t=jugueteria]{--wall:#1e4a47;--floor:#8b6f47;--shelf:#6b4a2f;--sign:#4a3018;--signc:#fff9c4}
#st[data-t=supermercado]{--wall:#e8eef4;--floor:#d8e2e8;--shelf:#fff;--sign:#fff;--signc:#1a3d5c}
#st[data-t=mercado]{--wall:#5a3a1c;--floor:#6b4a2c;--shelf:#4a3018;--sign:#6b4a2c;--signc:#fdf6e3}

.wall{position:absolute;inset:0 0 45% 0;z-index:1;background:
  radial-gradient(ellipse 80% 55% at 50% -20%, rgba(255,220,150,.16), transparent 70%),
  linear-gradient(to bottom, rgba(0,0,0,.22) 0%, transparent 15%, transparent 70%, rgba(0,0,0,.32) 100%),
  repeating-linear-gradient(0deg,transparent 0 20px,rgba(0,0,0,.06) 20px 22px),
  repeating-linear-gradient(90deg,transparent 0 20px,rgba(0,0,0,.06) 20px 22px),
  var(--wall);box-shadow:inset 0 -30px 50px -25px rgba(0,0,0,.45)}
.wall::after{content:'';position:absolute;left:0;right:0;bottom:0;height:11px;background:linear-gradient(to bottom,#b09068 0%,#8b6f47 40%,#4a3018 100%);border-bottom:2px solid rgba(0,0,0,.55);box-shadow:0 -2px 4px rgba(0,0,0,.2),0 4px 6px rgba(0,0,0,.35)}

.floor{position:absolute;inset:55% 0 0 0;z-index:0;background:
  linear-gradient(to bottom, rgba(255,255,255,.22) 0%, transparent 22%, rgba(0,0,0,.38) 100%),
  var(--floor);box-shadow:inset 0 4px 10px -3px rgba(0,0,0,.45)}
.floor::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.85;background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'%3E%3Cg stroke='rgba(0,0,0,0.11)' stroke-width='0.45' fill='none'%3E%3Cline x1='0' y1='100' x2='15' y2='0'/%3E%3Cline x1='20' y1='100' x2='29' y2='0'/%3E%3Cline x1='40' y1='100' x2='43' y2='0'/%3E%3Cline x1='60' y1='100' x2='57' y2='0'/%3E%3Cline x1='80' y1='100' x2='71' y2='0'/%3E%3Cline x1='100' y1='100' x2='85' y2='0'/%3E%3C/g%3E%3Cg stroke='rgba(0,0,0,0.08)' stroke-width='0.32' fill='none'%3E%3Cline x1='0' y1='14' x2='100' y2='14'/%3E%3Cline x1='0' y1='32' x2='100' y2='32'/%3E%3Cline x1='0' y1='56' x2='100' y2='56'/%3E%3Cline x1='0' y1='84' x2='100' y2='84'/%3E%3C/g%3E%3C/svg%3E");background-size:100% 100%}

.rug{position:absolute;left:18%;right:18%;bottom:25%;height:12%;z-index:1;filter:drop-shadow(0 4px 5px rgba(0,0,0,.45))}
.rug svg{width:100%;height:100%;display:block}
.rb{fill:#c0392b;stroke:#8b1a0f;stroke-width:1.5}.rd{fill:none;stroke:#f1c40f;stroke-width:.8;stroke-dasharray:1.5 1.5}.rm{fill:#f1c40f}

.gar,.lz{position:absolute;left:0;right:0;width:100%;pointer-events:none;overflow:visible}
.gar{top:10%;height:6%;z-index:4}.gar.b{top:15%;height:5%;opacity:.9}.lz{top:0;height:36%;z-index:3}

.win{position:absolute;left:31%;right:31%;top:13%;bottom:45%;padding:6px;background:
  linear-gradient(135deg, rgba(255,255,255,.20) 0%, transparent 30%),
  linear-gradient(180deg,#a0845c 0%,#6b4a2c 50%,#3a2410 100%);
  border:4px solid #3a2410;border-radius:5px;z-index:2;
  box-shadow:inset 0 0 15px rgba(0,0,0,.7),0 8px 20px rgba(0,0,0,.55)}
.win::before{content:'';position:absolute;left:-2%;right:-2%;bottom:-12px;height:16px;background:linear-gradient(to bottom,#b8956a 0%,#8b6f47 40%,#4a3018 100%);border:2px solid #3a2410;border-radius:3px;box-shadow:0 5px 10px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.15) inset}
.win::after{content:'';position:absolute;inset:5px;pointer-events:none;z-index:3;background-image:linear-gradient(90deg,transparent calc(50% - 2px),rgba(58,36,16,.85) calc(50% - 2px),rgba(58,36,16,.85) calc(50% + 2px),transparent calc(50% + 2px)),linear-gradient(0deg,transparent calc(50% - 2px),rgba(58,36,16,.85) calc(50% - 2px),rgba(58,36,16,.85) calc(50% + 2px),transparent calc(50% + 2px));border-radius:2px}

.cl,.cr{position:absolute;top:4px;bottom:4px;width:14%;z-index:2;background:linear-gradient(90deg,rgba(192,57,43,.9),rgba(192,57,43,.55) 40%,rgba(192,57,43,.15));box-shadow:inset -2px 0 3px rgba(0,0,0,.3)}
.cr{right:4px;transform:scaleX(-1)}

.amb{position:absolute;inset:0;z-index:4;pointer-events:none;background:
  radial-gradient(ellipse 90% 50% at 50% -10%, rgba(255,210,120,.22), transparent 65%),
  radial-gradient(ellipse 50% 30% at 50% 108%, rgba(255,150,60,.12), transparent 70%),
  radial-gradient(ellipse 70% 50% at 50% 50%, transparent 45%, rgba(0,0,0,.12) 100%)}

.tw{position:absolute;top:13%;bottom:38%;width:26%;background:
  linear-gradient(90deg, rgba(0,0,0,.38) 0%, transparent 15%, transparent 85%, rgba(0,0,0,.38) 100%),
  linear-gradient(180deg, rgba(255,255,255,.12) 0%, transparent 10%, transparent 90%, rgba(0,0,0,.3) 100%),
  var(--shelf);border:2px solid #4a3218;border-radius:3px;
  display:grid;grid-template-rows:repeat(5,1fr);gap:3px;padding:3px;z-index:2;
  box-shadow:5px 6px 0 rgba(0,0,0,.3),0 10px 20px rgba(0,0,0,.4)}
.tw.l{left:2%}.tw.r{right:2%}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:rgba(0,0,0,.30);padding:2px;border-radius:2px}
.sl{position:relative;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,transparent 45%,rgba(255,255,255,.06) 100%),rgba(245,230,200,.85);border-radius:2px;box-shadow:inset 0 2px 3px rgba(0,0,0,.25);overflow:hidden}
.sl .price{position:absolute;bottom:0;left:0;right:0;text-align:center;color:#f1c40f;font-weight:900;font-size:clamp(5px,.85vw,8px);line-height:1;padding:1px 0 2px;background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0));text-shadow:0 1px 2px rgba(0,0,0,.95);pointer-events:none;display:none;letter-spacing:-.3px;z-index:2}

.ctr{position:absolute;left:8%;right:8%;bottom:2%;height:22%;z-index:3}
.cb{position:absolute;inset:0;background:
  linear-gradient(180deg, rgba(255,255,255,.20) 0%, transparent 10%, rgba(0,0,0,.35) 100%),
  var(--shelf);border:2px solid #4a3218;border-radius:4px;
  box-shadow:0 6px 0 rgba(0,0,0,.35),0 12px 24px rgba(0,0,0,.45),inset 0 2px 3px rgba(255,255,255,.15)}
.cb::before{content:'';position:absolute;left:-3%;right:-3%;top:-9px;height:13px;background:linear-gradient(to bottom,#b8956a 0%,#8b6f47 60%,#5a3a1c 100%);border:2px solid #4a3218;border-radius:3px;box-shadow:inset 0 -2px 0 rgba(255,255,255,.12),0 3px 6px rgba(0,0,0,.45)}
#cs{position:absolute;left:3%;top:8%;width:56%;height:44%;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.reg{position:absolute;right:4%;top:8%;width:30%;height:70%;background:#3a2410;border:2px solid #1a0d05;border-radius:4px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 0 8px rgba(0,0,0,.6)}

/* HUD */
.hud{position:absolute;z-index:5000;pointer-events:none}
.hud > *{pointer-events:auto}

.hud-header{
  top:8px;left:8px;right:8px;
  display:flex;flex-direction:column;gap:6px;
}
.hud-row-1{
  display:flex;gap:6px;justify-content:space-between;align-items:center;flex-wrap:wrap;
}
.hud-row-2{
  display:flex;justify-content:center;
}
.hud-pill{
  display:flex;gap:4px;padding:4px;background:rgba(0,0,0,.62);border-radius:12px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 2px 6px rgba(0,0,0,.45);flex:none;
  align-items:center;
}
.hud-btn{
  width:36px;height:36px;min-width:36px;padding:0;border:1.5px solid rgba(255,255,255,.22);
  border-radius:9px;background:rgba(255,255,255,.1);color:#fff;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .15s,transform .1s;line-height:1;
}
.hud-btn:hover{background:rgba(255,255,255,.24);transform:scale(1.06)}
.hud-btn:active{transform:scale(.94)}
.hud-btn.on{background:var(--red);border-color:var(--gold)}
.hud-btn svg{width:18px;height:18px;display:block}

#rot{
  width:100%;max-width:520px;height:36px;
  background:var(--sign);border:2px solid #8b1a0f;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 2px #f1c40f,0 3px 6px rgba(0,0,0,.45);
  overflow:hidden;
}
#rotT{
  color:var(--signc);font:900 clamp(11px,1.8vw,17px) Georgia,serif;
  letter-spacing:1.2px;text-transform:uppercase;outline:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:96%;padding:0 6px;cursor:text;
}

#nom{
  width:98px;padding:5px 8px;border:1.5px solid rgba(255,255,255,.22);border-radius:9px;
  background:rgba(255,255,255,.1);color:#fff;font:inherit;font-size:.72rem;
}
#nom::placeholder{color:rgba(255,255,255,.55)}
#nom:focus{outline:2px solid var(--gold);outline-offset:1px}

/* Categorías: izquierda, vertical, centrado */
.hud-cats{
  left:4px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:4px;align-items:center;
  padding:4px;background:rgba(0,0,0,.62);border-radius:12px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 2px 8px rgba(0,0,0,.45);
  max-height:88%;overflow-y:auto;scrollbar-width:none;
}
.hud-cats::-webkit-scrollbar{display:none}

/* Modal categoría */
.cat-modal{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:6000;display:none;align-items:center;justify-content:center;padding:3%}
.cat-modal.on{display:flex}
.cat-modal-inner{background:var(--card);border:2px solid var(--gold);border-radius:14px;width:100%;max-width:560px;max-height:88%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.cat-modal-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--bg)}
.cat-modal-head b{color:var(--red);font-size:.95rem;text-transform:uppercase;letter-spacing:.5px}
.cat-modal-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;padding:10px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cat-item{background:var(--card);border:2px solid var(--bd);border-radius:8px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;cursor:pointer;color:var(--tx);min-width:0;transition:border-color .15s,transform .1s}
.cat-item:hover{border-color:var(--gold);transform:translateY(-2px)}
.cat-item:active{transform:translateY(0) scale(.98)}
.cat-item svg,.cat-item .rt{width:46px;height:46px}
.cat-item .rt{width:100%;font-size:.55rem}
.cat-item span{font-size:.6rem;font-weight:700;line-height:1.1;word-break:break-word}
.cat-item em{font-style:normal;font-size:.62rem;font-weight:900;background:#f1c40f;color:#222;border-radius:6px;padding:0 4px}

/* Objetos */
#lay{position:absolute;inset:0;z-index:20;pointer-events:none}
.it{position:absolute;width:min(11%,64px);aspect-ratio:1;cursor:grab;pointer-events:auto;touch-action:none;--scale:1}
.it.char{width:min(5.5%,36px)}
.it::before{content:'';position:absolute;left:12%;right:12%;bottom:-9%;height:18%;background:radial-gradient(ellipse at center, rgba(0,0,0,.45) 0%, transparent 70%);border-radius:50%;pointer-events:none;z-index:-1}
.it.dr{cursor:grabbing;filter:drop-shadow(0 10px 16px rgba(0,0,0,.6)) brightness(1.08)}
.it svg{width:100%;height:100%;display:block;filter:drop-shadow(3px 5px 4px rgba(0,0,0,.5)) drop-shadow(0 12px 8px rgba(0,0,0,.22));pointer-events:none}
.rt{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font:900 clamp(6px,1.2vw,10px) Georgia,serif;border:2.5px solid rgba(0,0,0,.5);border-radius:3px;padding:2px;line-height:1.1;pointer-events:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4),0 3px 5px rgba(0,0,0,.4)}

.x,.r2{position:absolute;width:calc(22px / var(--scale,1));height:calc(22px / var(--scale,1));min-width:0;min-height:0;border-radius:50%;border:solid #fff;border-width:calc(1.5px / var(--scale,1));color:#fff;font-weight:900;padding:0;line-height:1;display:none;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.4);cursor:pointer;top:calc(2px / var(--scale,1));font-size:calc(13px / var(--scale,1))}
.x{right:calc(2px / var(--scale,1));background:#e74c3c}
.r2{left:calc(2px / var(--scale,1));background:#3498db}
.it:hover .x,.it:hover .r2,.it.dr .x,.it.dr .r2,.it.sel .x,.it.sel .r2{display:flex}
.it.sel{outline:2px dashed #f1c40f;outline-offset:2px;border-radius:6px}

/* TEMAS */
#st[data-t=clasica]{--sky:#87ceeb}
#st[data-t=pasteleria]{--sky:#ffd6e6}
#st[data-t=pasteleria] .wall{background-image:radial-gradient(circle,rgba(255,150,180,.35) 2px,transparent 3px);background-size:36px 36px}
#st[data-t=pasteleria] .floor{background-image:repeating-conic-gradient(#fff 0 25%,#f5e0e8 0 50%);background-size:56px 56px}
#st[data-t=pasteleria] .floor::after{display:none}
#st[data-t=pasteleria] .tw{border-color:#d4af37;box-shadow:4px 4px 0 #c090a8,0 8px 16px rgba(0,0,0,.25)}
#st[data-t=pasteleria] .gar,#st[data-t=pasteleria] .lz{display:none}
#st[data-t=pasteleria] .rb{fill:#ffd6e6;stroke:#d4af37}
#st[data-t=pasteleria] .win{background:linear-gradient(135deg,rgba(255,255,255,.3),transparent 30%),linear-gradient(180deg,#ffe0ec 0%,#ffb8d0 50%,#d46a8e 100%);border-color:#c98ba8}
#st[data-t=pasteleria] .win::before{background:linear-gradient(to bottom,#ffe8f0,#ffc8dc 40%,#d46a8e);border-color:#c98ba8}
#st[data-t=jugueteria]{--sky:#1b2f5a}
#st[data-t=supermercado]{--sky:#a8d4f0}
#st[data-t=mercado]{--sky:#f5c98a}
#st[data-t=jugueteria] .wall{background-image:linear-gradient(transparent 60%,rgba(74,48,24,.9) 60%),repeating-linear-gradient(90deg,transparent 0 18px,rgba(0,0,0,.3) 18px 20px)}
#st[data-t=jugueteria] .rb{fill:#0f3d1a;stroke:#f1c40f}
#st[data-t=supermercado] .wall{background-image:repeating-linear-gradient(90deg,transparent 0 80px,rgba(52,152,219,.2) 80px 82px);border-color:#3498db}
#st[data-t=supermercado] .win,#st[data-t=supermercado] .gar,#st[data-t=supermercado] .lz,#st[data-t=mercado] .win{display:none}
#st[data-t=supermercado] .tw{border-color:#3498db;border-radius:0}
#st[data-t=supermercado] .floor{background-image:repeating-linear-gradient(90deg,transparent 0 50px,rgba(52,152,219,.2) 50px 52px)}
#st[data-t=supermercado] .floor::after{display:none}
#st[data-t=supermercado] .rb{fill:#3498db;stroke:#1a5580}
#st[data-t=supermercado] .wall::after,#st[data-t=mercado] .wall::after{position:absolute;left:34%;right:34%;top:24%;text-align:center;font:900 clamp(9px,2.6vw,22px) system-ui;border:3px dashed currentColor;padding:5% 0;border-radius:8px;background:none;height:auto;bottom:auto;box-shadow:none;border-bottom:3px dashed currentColor}
#st[data-t=supermercado] .wall::after{content:'🛒 OFERTAS';color:#c0392b;border-color:#c0392b}
#st[data-t=mercado] .wall::after{content:'🏮 ARTESANÍAS';color:#ffd27a;border-color:#ffd27a}
#st[data-t=mercado] .wall{background-image:repeating-linear-gradient(0deg,transparent 0 30px,rgba(0,0,0,.2) 30px 32px)}
#st[data-t=mercado] .amb{background:radial-gradient(circle at 15% 30%,rgba(255,120,50,.28),transparent 28%),radial-gradient(circle at 85% 35%,rgba(255,150,60,.28),transparent 28%),radial-gradient(ellipse 100% 45% at 50% 0,rgba(255,180,80,.2),transparent 60%)}
#st[data-t=mercado] .rb{fill:#8b1a0f;stroke:#d4af37}

.scr{background:#050505;color:#90ee90;padding:3px 6px;text-align:center;border-radius:3px;width:90%;font-size:clamp(5px,1vw,8px);font-weight:700;letter-spacing:1px;box-shadow:0 0 8px rgba(144,238,144,.35),inset 0 0 4px rgba(0,0,0,.8);transition:background .4s,color .4s,box-shadow .4s}
.scr b{display:block;color:#fff;font:900 clamp(9px,2vw,16px) 'Courier New',monospace;letter-spacing:0;transition:color .4s}
#st[data-t=clasica] .scr{background:#0a1f0a;color:#7dff7d;box-shadow:0 0 10px rgba(125,255,125,.4),inset 0 0 4px rgba(0,0,0,.8)}
#st[data-t=clasica] .scr b{color:#e8ffe8}
#st[data-t=pasteleria] .scr{background:#3a0a22;color:#ff9ec4;box-shadow:0 0 10px rgba(255,158,196,.45),inset 0 0 4px rgba(0,0,0,.8)}
#st[data-t=pasteleria] .scr b{color:#ffe6f0}
#st[data-t=jugueteria] .scr{background:#0a1f1c;color:#7dffc8;box-shadow:0 0 10px rgba(125,255,200,.4),inset 0 0 4px rgba(0,0,0,.8)}
#st[data-t=jugueteria] .scr b{color:#e0fff5}
#st[data-t=supermercado] .scr{background:#0a1a2e;color:#7ec8ff;box-shadow:0 0 10px rgba(126,200,255,.45),inset 0 0 4px rgba(0,0,0,.8)}
#st[data-t=supermercado] .scr b{color:#e6f4ff}
#st[data-t=mercado] .scr{background:#2a1808;color:#ffd27a;box-shadow:0 0 10px rgba(255,210,122,.45),inset 0 0 4px rgba(0,0,0,.8)}
#st[data-t=mercado] .scr b{color:#fff5e0}

.lz ellipse{animation:luzTwinkle 2.4s ease-in-out infinite}
.lz ellipse:nth-child(2){animation-delay:.4s}
.lz ellipse:nth-child(3){animation-delay:.8s}
.lz ellipse:nth-child(4){animation-delay:1.2s}
.lz ellipse:nth-child(5){animation-delay:1.6s}
@keyframes luzTwinkle{0%,100%{opacity:1;filter:brightness(1)}50%{opacity:.55;filter:brightness(1.6)}}
.gar path[stroke="#e74c3c"],.gar path[stroke="#f1c40f"],.gar path[stroke="#3498db"]{animation:garlandPulse 3s ease-in-out infinite}
.gar path[stroke="#f1c40f"]{animation-delay:.5s}
.gar path[stroke="#3498db"]{animation-delay:1s}
@keyframes garlandPulse{0%,100%{opacity:.85}50%{opacity:1;filter:drop-shadow(0 0 3px currentColor)}}

.wp{position:relative;width:100%;height:100%;overflow:hidden;background:var(--sky,#87ceeb);box-shadow:inset 0 0 25px rgba(135,206,235,.55)}
.wp svg.base-scene{width:100%;height:100%;display:block;position:absolute;inset:0;z-index:0}
.sk{fill:var(--sky,#87ceeb)}
.wp::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:3;background:linear-gradient(135deg,rgba(255,255,255,.28) 0%,transparent 22%,transparent 78%,rgba(255,255,255,.12) 100%)}
.wp::after{content:'';position:absolute;left:0;right:0;bottom:0;height:12%;z-index:3;background:radial-gradient(circle at 10% 80%,#fff 0 4px,transparent 5px),radial-gradient(circle at 35% 60%,#fff 0 5px,transparent 6px),radial-gradient(circle at 60% 75%,#fff 0 4px,transparent 5px),radial-gradient(circle at 85% 60%,#fff 0 5px,transparent 6px),linear-gradient(to top,#fff,rgba(255,255,255,0))}

.birds-layer{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.bird{position:absolute;font-size:clamp(6px,1.4vw,11px);opacity:.75;left:-10%;animation:birdFly linear infinite;will-change:left,transform}
@keyframes birdFly{0%{left:-10%;transform:translateY(0)}25%{transform:translateY(-8%)}50%{transform:translateY(4%)}75%{transform:translateY(-5%)}100%{left:110%;transform:translateY(0)}}

.vehicles-layer{position:absolute;left:0;right:0;bottom:0;height:18%;z-index:2;pointer-events:none;overflow:hidden}
.vehicle{position:absolute;bottom:12%;height:55%;aspect-ratio:2.1;border-radius:3px 3px 1px 1px;box-shadow:0 1px 3px rgba(0,0,0,.35);animation:carPass linear infinite;will-change:left,opacity;left:-30%}
.vehicle::before{content:'';position:absolute;left:12%;right:12%;top:8%;height:38%;background:rgba(255,255,255,.35);border-radius:2px}
.vehicle::after{content:'';position:absolute;left:8%;right:8%;bottom:-18%;height:22%;background:radial-gradient(ellipse at center, rgba(0,0,0,.4) 0%, transparent 70%)}
@keyframes carPass{0%{left:-30%;opacity:0}5%{opacity:1}95%{opacity:1}100%{left:130%;opacity:0}}

#ov{position:absolute;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:7000;padding:16px;color:#fff;text-align:center}
#ov.on{display:flex}
#ov img{max-width:100%;max-height:70%;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.6)}
#ov button{border:none;padding:9px 20px;border-radius:22px;font-weight:800;font-size:.85rem;color:#222;background:linear-gradient(135deg,#d4af37,#f1c40f);cursor:pointer}
#toast{position:absolute;bottom:16%;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:9px 18px;border-radius:24px;font-size:.82rem;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:8000;max-width:80%;text-align:center}
#toast.on{opacity:1}

@media(max-width:600px){
  body{padding:5px}
  h1{font-size:.95rem;margin:2px 0 6px}
  #box{padding:5px;border-radius:12px}
  .win{left:28%;right:28%}
  .tw{width:24%}
  .hud-header{top:calc(12px + env(safe-area-inset-top,0px))}
  .hud-btn{width:32px;height:32px;min-width:32px;font-size:16px}
  .hud-btn svg{width:15px;height:15px}
  #rot{height:32px;max-width:100%}
  #rotT{font-size:clamp(9px,2.4vw,13px)}
  #nom{width:78px;font-size:.66rem;padding:4px 6px}
  .hud-cats{left:3px;gap:3px;padding:3px}
  .hud-cats .hud-btn{width:32px;height:32px;min-width:32px;font-size:16px}
  .cat-modal-items{grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:4px;padding:8px}
  .cat-item svg,.cat-item .rt{width:38px;height:38px}
}
@media(hover:none){
  .it:hover .x,.it:hover .r2{display:none}
  .it.sel .x,.it.sel .r2,.it.dr .x,.it.dr .r2{display:flex}
}
@media(prefers-reduced-motion:reduce){
  .lz ellipse,.gar path,.bird,.vehicle{animation:none!important}
}
</style>

    $(id).innerHTML=h;
  });
  $('cs').innerHTML='<div class="sl" data-z="m"><span class="price"></span></div>'.repeat(4);
}

function calcZones(){
  const R=stage.getBoundingClientRect();
  zones=[];
  if(R.width<10)return;
  stage.querySelectorAll('.sl').forEach(z=>{
    const r=z.getBoundingClientRect();
    zones.push({
      l:(r.left-R.left)/R.width*100,
      t:(r.top-R.top)/R.height*100,
      r:(r.right-R.left)/R.width*100,
      b:(r.bottom-R.top)/R.height*100,
      k:z.dataset.z,
      el:z
    });
  });
  updateTotal();
  lay.querySelectorAll('.it').forEach(el=>{
    const it=st.items[+el.dataset.i];
    if(it)el.classList.toggle('es',!!zoneOf(it.x,it.y));
  });
}

const zoneOf=(x,y)=>zones.find(z=>x>=z.l&&x<=z.r&&y>=z.t&&y<=z.b);
const zi=it=>{const z=zoneOf(it.x,it.y);return (z?(z.k==='m'?3:1):2)*1000+Math.round(it.y*5);};

function total(){
  let s=0;
  st.items.forEach(it=>{
    const d=DEF[it.id];
    if(d&&zoneOf(it.x,it.y))s+=d.p;
  });
  return s;
}

function updateSlotPrices(){
  zones.forEach(z=>{
    if(!z.el)return;
    const p=z.el.querySelector('.price');
    if(p){p.textContent='';p.style.display='none';}
  });
  st.items.forEach(it=>{
    const z=zoneOf(it.x,it.y);
    if(!z||!z.el)return;
    const d=DEF[it.id];if(!d)return;
    const p=z.el.querySelector('.price');
    if(p){p.textContent=fm(d.p);p.style.display='block';}
  });
}

function updateTotal(){
  $('tot').textContent=fm(total());
  updateSlotPrices();
}

function render(){
  lay.innerHTML='';
  st.items.forEach((it,i)=>{
    const d=DEF[it.id];if(!d)return;
    const isChar=isCharId(it.id);
    const sc=it.sc||(isChar?CHAR_SCALES[0]:REG_SCALES[0]);
    const el=document.createElement('div');
    el.className='it'+(isChar?' char':'');
    el.dataset.i=i;
    el.style.setProperty('--scale',sc);
    el.style.left=it.x+'%';
    el.style.top=it.y+'%';
    el.style.transform=`translate(-50%,-50%) scale(${sc}) rotate(${it.r||0}deg)`;
    el.style.zIndex=zi(it);
    if(zoneOf(it.x,it.y))el.classList.add('es');
    const body=d.s||`<div class="rt" style="background:${d.c||'#c0392b'}">${esc(d.t||d.n)}</div>`;
    el.innerHTML=body
      +`<button class="x" type="button" aria-label="Eliminar">×</button>`
      +`<button class="r2" type="button" aria-label="Rotar">⟳</button>`;
    lay.appendChild(el);
  });
  updateTotal();
}

let drag=null;
lay.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.it');if(!el)return;
  const i=+el.dataset.i;
  if(e.target.closest('.x')){st.items.splice(i,1);save();render();return;}
  if(e.target.closest('.r2')){
    st.items[i].r=((st.items[i].r||0)+45)%360;
    save();render();
    const ne=lay.querySelector(`.it[data-i="${i}"]`);if(ne)ne.classList.add('sel');
    return;
  }
  lay.querySelectorAll('.it.sel').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');
  drag={i,el,r:stage.getBoundingClientRect(),sx:e.clientX,sy:e.clientY,moved:false};
  el.classList.add('dr');
  e.preventDefault();
});

document.addEventListener('pointermove',e=>{
  if(!drag)return;
  const it=st.items[drag.i];if(!it){drag=null;return;}
  const r=drag.r;
  const x=((e.clientX-r.left)/r.width)*100;
  const y=((e.clientY-r.top)/r.height)*100;
  it.x=Math.max(2,Math.min(98,x));
  it.y=Math.max(2,Math.min(98,y));
  drag.el.style.left=it.x+'%';
  drag.el.style.top=it.y+'%';
  drag.el.style.zIndex=zi(it);
  drag.el.classList.toggle('es',!!zoneOf(it.x,it.y));
  if(Math.abs(e.clientX-drag.sx)>3||Math.abs(e.clientY-drag.sy)>3)drag.moved=true;
  updateTotal();
});

document.addEventListener('pointerup',()=>{
  if(!drag)return;
  const {i,el,moved}=drag;
  el.classList.remove('dr');
  if(!moved){
    const it=st.items[i];
    if(it){
      const isChar=isCharId(it.id);
      const scales=scalesFor(isChar);
      const labels=labelsFor(isChar);
      const cur=it.sc||scales[0];
      let idx=scales.findIndex(v=>Math.abs(v-cur)<0.05);
      if(idx<0) idx=0;
      const nextIdx=(idx+1)%scales.length;
      it.sc=scales[nextIdx];
      toast(`Tamaño: ${labels[nextIdx]}`);
      save();render();
      const ne=lay.querySelector(`.it[data-i="${i}"]`);if(ne)ne.classList.add('sel');
    }
  }else{save();}
  drag=null;
});

function addItem(id){
  const d=DEF[id];if(!d)return;
  const isChar=isCharId(id);
  st.items.push({
    id,
    x:50+(Math.random()-.5)*20,
    y:72+(Math.random()-.5)*10,
    sc:isChar?CHAR_SCALES[0]:REG_SCALES[0],
    r:0
  });
  save();render();
  toast(`✅ ${d.n}`);
}

/* TEMAS */
function buildThemes(){
  const T=$('temas');T.innerHTML='';
  const themes=[
    ['clasica','🪵','Clásica'],
    ['pasteleria','🧁','Pastelería'],
    ['jugueteria','🛠️','Taller'],
    ['supermercado','🛒','Súper'],
    ['mercado','🏮','Mercado']
  ];
  themes.forEach(([id,emoji,label])=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='hud-btn'+(id===st.tema?' on':'');
    b.textContent=emoji;
    b.title=label;
    b.setAttribute('aria-label',label);
    b.onclick=()=>{
      st.tema=id;
      stage.dataset.t=id;
      document.documentElement.dataset.store=id;
      save();buildThemes();calcZones();
    };
    T.appendChild(b);
  });
}

/* CATEGORÍAS */
function buildCats(){
  const H=$('hudCats');H.innerHTML='';
  const cats=[
    ['beb','☕','Bebidas'],
    ['per','🎅','Personajes'],
    ['reg','🎁','Regalos'],
    ['dul','🍰','Dulces'],
    ['com','🍪','Comida'],
    ['dec','✨','Decoración'],
    ['otr','📦','Otros']
  ];
  cats.forEach(([id,emoji,label])=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='hud-btn';
    b.textContent=emoji;
    b.title=label;
    b.setAttribute('aria-label',label);
    b.onclick=()=>openCatModal(id);
    H.appendChild(b);
  });
}

function openCatModal(catId){
  const catData=CAT.find(c=>c[0]===catId);
  if(!catData)return;
  $('catModalTitle').textContent=catData[1];
  const grid=$('catModalItems');
  grid.innerHTML='';
  catData[2].forEach((a,idx)=>{
    const id=catId+idx;
    const d=DEF[id];if(!d)return;
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='cat-item';
    const body=d.s||`<div class="rt" style="background:${d.c||'#c0392b'}">${esc(d.t||d.n)}</div>`;
    btn.innerHTML=body+`<span>${esc(d.n)}</span><em>${fm(d.p)}</em>`;
    btn.onclick=()=>{addItem(id);closeCatModal();};
    grid.appendChild(btn);
  });
  $('catModal').classList.add('on');
}
function closeCatModal(){ $('catModal').classList.remove('on'); }
$('catModalClose').onclick=closeCatModal;
$('catModal').addEventListener('click',e=>{ if(e.target===$('catModal'))closeCatModal(); });

/* RÓTULO */
const rotT=$('rotT');
rotT.textContent=st.rot||'Mi Tienda Navideña';
rotT.addEventListener('blur',()=>{
  const t=rotT.textContent.replace(/\s+/g,' ').trim();
  st.rot=t||'Mi Tienda Navideña';
  rotT.textContent=st.rot;
  save();
});
rotT.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();rotT.blur();} });
rotT.addEventListener('paste',e=>{
  e.preventDefault();
  const t=(e.clipboardData||window.clipboardData).getData('text/plain');
  document.execCommand('insertText',false,t);
});

/* NOMBRE */
$('nom').value=st.nom||'';
$('nom').oninput=e=>{st.nom=e.target.value;save();};

/* FULLSCREEN */
const FS_ENTER='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>';
const FS_EXIT ='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9H3V3M15 9h6V3M9 15H3v6M15 15h6v6"/></svg>';
function updateFsIcon(){
  const b=$('fsTop');if(!b)return;
  const on=!!document.fullscreenElement;
  b.innerHTML=on?FS_EXIT:FS_ENTER;
  b.title=on?'Salir de pantalla completa':'Pantalla completa';
  b.setAttribute('aria-label',b.title);
}
function toggleFs(){
  if(document.fullscreenElement)document.exitFullscreen();
  else stage.requestFullscreen?.().catch?.(()=>{});
}
$('fsTop').onclick=toggleFs;
document.addEventListener('fullscreenchange',updateFsIcon);

/* PNG - 2000px en el lado más angosto */
$('png').onclick=async()=>{
  if(typeof html2canvas!=='function'){toast('⚠️ Exportación no disponible');return;}
  toast('⏳ Generando imagen…');
  try{
    const rect=stage.getBoundingClientRect();
    const minSide=Math.min(rect.width,rect.height);
    const scale=Math.min(6,Math.max(1,2000/Math.max(minSide,1)));
    const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#eef5fb';
    const canvas=await html2canvas(stage,{backgroundColor:bg,useCORS:true,scale,logging:false});
    if(st.nom){
      const ctx=canvas.getContext('2d');
      const fs=Math.max(18,Math.round(canvas.width/45));
      ctx.fillStyle='rgba(0,0,0,.75)';
      ctx.font='bold '+fs+'px system-ui,sans-serif';
      ctx.textAlign='right';
      ctx.fillText('por '+st.nom,canvas.width-canvas.width*.03,canvas.height-canvas.height*.02);
    }
    $('ovi').src=canvas.toDataURL('image/png');
    $('ov').classList.add('on');
    toast('✅ Imagen lista');
  }catch(err){
    console.error(err);toast('❌ No se pudo generar');
  }
};

$('clr').onclick=()=>{
  if(!st.items.length){toast('Ya está vacío');return;}
  if(confirm('¿Borrar todos los objetos de la tienda?')){
    st.items=[];save();render();toast('🧹 Tienda limpiada');
  }
};

$('ovc').onclick=()=>$('ov').classList.remove('on');
$('ov').addEventListener('click',e=>{if(e.target===$('ov'))$('ov').classList.remove('on');});

function spawnBirds(){
  const L=$('birdsLayer');if(!L)return;
  L.innerHTML='';
  for(let i=0;i<2;i++){
    const b=document.createElement('span');
    b.className='bird';b.textContent='🕊';
    b.style.top=(15+Math.random()*25)+'%';
    b.style.animationDuration=(14+Math.random()*10)+'s';
    b.style.animationDelay=(i*7)+'s';
    L.appendChild(b);
  }
}
function spawnVehicles(){
  const L=$('vehiclesLayer');if(!L)return;
  L.innerHTML='';
  const colors=['#c0392b','#3498db','#2e9e3f','#f39c12','#8e44ad'];
  for(let i=0;i<2;i++){
    const v=document.createElement('div');
    v.className='vehicle';
    v.style.background=colors[i%colors.length];
    v.style.animationDuration=(9+Math.random()*5)+'s';
    v.style.animationDelay=(i*5+Math.random()*3)+'s';
    L.appendChild(v);
  }
}

function init(){
  st.items=st.items.filter(it=>it&&typeof it.id==='string'&&DEF[it.id]
    &&typeof it.x==='number'&&typeof it.y==='number');

  buildSlots();
  buildThemes();
  buildCats();

  stage.dataset.t=st.tema;
  document.documentElement.dataset.store=st.tema;

  render();
  requestAnimationFrame(()=>{calcZones();render();});

  if(window.ResizeObserver)new ResizeObserver(()=>calcZones()).observe(stage);
  else window.addEventListener('resize',calcZones);

  spawnBirds();
  spawnVehicles();
  updateFsIcon();
}
init();
</script>
</body>
